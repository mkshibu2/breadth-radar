      // Set input bindings for updates when core fields change
      ['f_entryPrice', 'f_slPrice', 'f_brokerage', 'f_cap'].forEach(id => {
        $('#' + id).oninput = () => {
          const entryPct = (parseFloat($('#f_entryPct').value) || 0) / 100;
          const capital = parseFloat($('#f_cap').value) || cap;
          const entryPrice = parseFloat($('#f_entryPrice').value);
          const slPrice = parseFloat($('#f_slPrice').value);
          const c = computeEntryCalc({ capital, riskPct, entryPct, entryPrice, slPrice, brokerage: 0 });
          if (c.fullQty != null) {
            $('#f_qty').value = Math.floor(c.fullQty * entryPct);
          }
          updateAddCalc();
        };
        $('#' + id).onchange = () => {
          $('#' + id).oninput();
        };
      });

      // Linked tranche pct -> qty
      $('#f_entryPct').oninput = () => {
        const entryPct = (parseFloat($('#f_entryPct').value) || 0) / 100;
        const capital = parseFloat($('#f_cap').value) || cap;
        const entryPrice = parseFloat($('#f_entryPrice').value);
        const slPrice = parseFloat($('#f_slPrice').value);
        const c = computeEntryCalc({ capital, riskPct, entryPct, entryPrice, slPrice, brokerage: 0 });
        if (c.fullQty != null) {
          $('#f_qty').value = Math.floor(c.fullQty * entryPct);
        }
        updateAddCalc();
      };
      $('#f_entryPct').onchange = () => {
        $('#f_entryPct').oninput();
      };

      // Linked tranche qty -> pct
      $('#f_qty').oninput = () => {
        const qty = parseFloat($('#f_qty').value);
        const capital = parseFloat($('#f_cap').value) || cap;
        const entryPrice = parseFloat($('#f_entryPrice').value);
        const slPrice = parseFloat($('#f_slPrice').value);
        const slPerShare = (entryPrice != null && slPrice != null) ? (entryPrice - slPrice) : null;
        const fullQty = (slPerShare && slPerShare > 0) ? Math.floor((capital * riskPct) / slPerShare) : null;
        if (fullQty && !isNaN(qty)) {
          $('#f_entryPct').value = +((qty / fullQty) * 100).toFixed(1);
        }
        updateAddCalc();
      };
      $('#f_qty').onchange = () => {
        $('#f_qty').oninput();
      };

      $('#f_remarks').addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !e.shiftKey) {
          e.preventDefault();
          $('#saveTradeBtn').focus();
        }
      });

      $('#f_breadth').oninput = () => {
        const mbs = parseFloat($('#f_breadth').value);
        if (!isNaN(mbs)) {
          let tranche = 25;
          if (mbs >= 75) tranche = 100;
          else if (mbs >= 45) tranche = 50;
          $('#f_entryPct').value = tranche;
          // recalculate qty
          const capital = parseFloat($('#f_cap').value) || cap;
          const entryPrice = parseFloat($('#f_entryPrice').value);
          const slPrice = parseFloat($('#f_slPrice').value);
          const c = computeEntryCalc({ capital, riskPct, entryPct: tranche / 100, entryPrice, slPrice, brokerage: 0 });
          if (c.fullQty != null) {
            $('#f_qty').value = Math.floor(c.fullQty * (tranche / 100));
          }
        }
        updateAddCalc();
      };

      // Tag manual inputs to prevent auto-overwrites
      ['f_e2p', 'f_e2q', 'f_e3p', 'f_e3q'].forEach(id => {
        $('#' + id).oninput = () => {
          $('#' + id).removeAttribute('data-auto');
        };
      });

      handleQtyPercentageInput($('#f_e2q'), () => parseFloat($('#calc_fullQty').textContent) || 0);
      handleQtyPercentageInput($('#f_e3q'), () => parseFloat($('#calc_fullQty').textContent) || 0);

      updateAddCalc();

      if ($('#f_isIntraday')) {
        $('#f_isIntraday').onchange = () => {
          $('#f_brokerage')?.removeAttribute('data-manual');
          updateAddCalc();
        };
      }

      if ($('#f_brokerage')) {
        $('#f_brokerage').oninput = () => {
          const val = $('#f_brokerage').value.trim();
          if (val === '') {
            $('#f_brokerage').removeAttribute('data-manual');
          } else {
            $('#f_brokerage').setAttribute('data-manual', 'true');
          }
          updateAddCalc();
        };
      }

      function updateAddCalc() {
        const entryPrice = parseFloat($('#f_entryPrice').value);
        const slPrice = parseFloat($('#f_slPrice').value);
        const entryPct = (parseFloat($('#f_entryPct').value) || 0) / 100;
        const capital = parseFloat($('#f_cap').value) || cap;

        const brokEl = $('#f_brokerage');
        let brokerage = parseFloat(brokEl?.value) || 0;

        const tempUserQty = parseFloat($('#f_qty').value);
        const tempCalculatedQty = (!isNaN(entryPrice) && !isNaN(slPrice) && (entryPrice - slPrice > 0)) ? Math.floor(Math.floor((capital * riskPct) / (entryPrice - slPrice)) * entryPct) : 0;
        const calcQty = !isNaN(tempUserQty) ? tempUserQty : tempCalculatedQty;

        const isIntraday = $('#f_isIntraday')?.checked;
        if (!isNaN(entryPrice) && calcQty > 0 && brokEl && brokEl.getAttribute('data-manual') !== 'true') {
          const buyTurnover = entryPrice * calcQty;
          brokerage = calcTradeCharges(buyTurnover, buyTurnover, isIntraday);
          brokEl.value = brokerage;
        }

        const c = computeEntryCalc({ capital, riskPct, entryPct, entryPrice: isNaN(entryPrice) ? null : entryPrice, slPrice: isNaN(slPrice) ? null : slPrice, brokerage });

        const userQty = parseFloat($('#f_qty').value);
        const qty = !isNaN(userQty) ? userQty : (c.entry1Qty || 0);

        const slPerShare = c.slPerShare;
        const posSize = (entryPrice != null) ? Math.round(entryPrice * qty + brokerage) : null;
        const risk = (slPerShare != null) ? Math.round(qty * slPerShare) : null;

        $('#calc_slPerShare').textContent = c.slPerShare != null ? fmt(c.slPerShare) : '—';
        $('#calc_slPct').textContent = c.slPct != null ? fmtPct(c.slPct) : '—';
        $('#calc_fullQty').textContent = c.fullQty != null ? c.fullQty : '—';
        $('#calc_entryQty').textContent = qty;
        $('#calc_entryAmt').textContent = posSize != null ? fmtRs(posSize) : '—';
        $('#calc_riskAtSL').textContent = risk != null ? fmtRs(risk) : '—';

        // Auto prefill Entry 2 (30% Qty) and Entry 3 (20% Qty) if not manually modified
        if (c.fullQty != null && !isNaN(entryPrice)) {
          if (!$('#f_e2q').value || $('#f_e2q').getAttribute('data-auto') === 'true') {
            $('#f_e2q').value = Math.floor(c.fullQty * 0.3);
            $('#f_e2q').setAttribute('data-auto', 'true');
          }
          if (!$('#f_e3q').value || $('#f_e3q').getAttribute('data-auto') === 'true') {
            $('#f_e3q').value = Math.floor(c.fullQty * 0.2);
            $('#f_e3q').setAttribute('data-auto', 'true');
          }
        }
      }

      $('#saveTradeBtn').onclick = async () => {
        const entryPrice = parseFloat($('#f_entryPrice').value);
        const slPrice = parseFloat($('#f_slPrice').value);
        const entryPct = (parseFloat($('#f_entryPct').value) || 50) / 100;
        const brokerage = parseFloat($('#f_brokerage').value) || 0;
        const stock = $('#f_stock').value.trim().toUpperCase();
        if (!stock || isNaN(entryPrice) || isNaN(slPrice)) { toast('Stock, entry price and SL price are required', 'err'); return; }

        const capital = parseFloat($('#f_cap').value) || cap;
        const c = computeEntryCalc({ capital, riskPct, entryPct, entryPrice, slPrice, brokerage });

        const userQty = parseFloat($('#f_qty').value);
        const qty = !isNaN(userQty) ? userQty : (c.entry1Qty || 0);
        const entryAmt = entryPrice && qty ? Math.round(entryPrice * qty + brokerage) : 0;
        const totLossAtSL = c.slPerShare && qty ? Math.round(qty * c.slPerShare) : 0;

        const e2p = parseFloat($('#f_e2p').value), e2q = parseFloat($('#f_e2q').value);
        const e3p = parseFloat($('#f_e3p').value), e3q = parseFloat($('#f_e3q').value);

        const trade = {
          status: 'open', openDate: $('#f_openDate').value, breadth: $('#f_breadth').value || '',
          entryPct, riskPerShare: capital * riskPct * entryPct, stock,
          entry1Price: entryPrice, entry1Qty: qty, entry1Amt: entryAmt,
          entry2Price: isNaN(e2p) ? '' : e2p, entry2Qty: isNaN(e2q) ? '' : e2q, entry2Amt: (!isNaN(e2p) && !isNaN(e2q)) ? Math.round(e2p * e2q) : '',
          entry2Date: (!isNaN(e2p) && !isNaN(e2q)) ? ($('#f_e2d').value || $('#f_openDate').value) : '',
          entry3Price: isNaN(e3p) ? '' : e3p, entry3Qty: isNaN(e3q) ? '' : e3q, entry3Amt: (!isNaN(e3p) && !isNaN(e3q)) ? Math.round(e3p * e3q) : '',
          entry3Date: (!isNaN(e3p) && !isNaN(e3q)) ? ($('#f_e3d').value || $('#f_openDate').value) : '',
          slPrice, slPerShare: c.slPerShare, slPct: c.slPct, fullQty: c.fullQty, totLossAtSL, brokerage,
          tradeType: $('#f_isIntraday')?.checked ? 'intraday' : 'delivery',
          setup: $('#f_setup').value.trim(),
          remarks: $('#f_remarks').value
        };
        const buy = aggregateBuy(normalizeTrade(trade));
        trade.totBuyQty = buy.totBuyQty; trade.totBuyAmt = buy.totBuyAmt; trade.avgBuyPrice = buy.avgBuyPrice;

        const pnlData = computeOpenTradePnL(trade);
        trade.pnl = pnlData.pnl;
        trade.pnlPct = pnlData.pnlPct;
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        trade.id = 'T' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());

        const normTrade = normalizeTrade(trade);
        STATE.trades.unshift(normTrade);
        STATE.prefillTrade = null;
        saveLocalState();
        STATE.view = 'trades';
        toast('Trade saved', 'ok');
        renderShell();

        apiPost({ action: 'addTrade', trade }).catch(err => {
          toast('Sync to Sheet failed: ' + err.message, 'err');
        });
      };
    }

    /* =========================================================================
       TRADE MODAL (view / add pyramid / close / delete)
       ========================================================================= */
    function openTradeModal(t) {
      const buildTrancheRow = (num, label, price, qty) => {
        return `
          <div style="display: grid; grid-template-columns: 85px 1fr 1fr; gap: 8px; align-items: center; background:rgba(255,255,255,.02); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line);">
            <span style="color:var(--sub); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${label}">${label}:</span>
            <input type="number" step="0.01" class="edit-buy-price" data-tranche="${num}" value="${price != null ? price : ''}" style="width:100%; padding: 4px 6px; border-radius: 4px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-family: var(--mono);" placeholder="Price">
            <input type="number" class="edit-buy-qty" data-tranche="${num}" value="${qty != null ? qty : ''}" style="width:100%; padding: 4px 6px; border-radius: 4px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-family: var(--mono);" placeholder="Qty">
          </div>
        `;
      };

      let prefillPrice = '';
      let prefillQty = '';
      let qtyLabel = 'Qty';
      if (t.status === 'open') {
        if (!t.entry2Price) {
          prefillQty = Math.floor(Number(t.fullQty || 0) * 0.3) || '';
          qtyLabel = 'Qty (30%)';
        } else if (!t.entry3Price) {
          prefillQty = Math.floor(Number(t.fullQty || 0) * 0.2) || '';
          qtyLabel = 'Qty (20%)';
        } else if (!t.entry4Price) {
          prefillQty = Math.floor(Number(t.fullQty || 0) * 0.2) || '';
          qtyLabel = 'Qty (20%)';
        } else if (!t.entry5Price) {
          prefillQty = Math.floor(Number(t.fullQty || 0) * 0.2) || '';
          qtyLabel = 'Qty (20%)';
        } else if (!t.entry6Price) {
          prefillQty = Math.floor(Number(t.fullQty || 0) * 0.2) || '';
          qtyLabel = 'Qty (20%)';
        } else {
          prefillQty = '';
          qtyLabel = 'Qty';
        }
      }

      // Parse extra tranches from remarks
      const extraTranches = {};
      const extraExits = {};
      const remarks = t.remarks || '';

      // Parse buys
      const regex = /\[Tranche (\d+): ₹([\d\.,]+) × (\d+)(?:\s+on\s+([^\]]+))?\]/g;
      let match;
      while ((match = regex.exec(remarks)) !== null) {
        const num = parseInt(match[1]);
        const price = parseFloat(match[2].replace(/,/g, ''));
        const qty = parseInt(match[3]);
        const date = match[4] || '';
        const amt = Math.round(price * qty);
        extraTranches[num] = { price, qty, amt, date };
      }

      // Parse exits
      const regexExit = /\[Exit (\d+): ₹([\d\.,]+) × (\d+)\]/g;
      let matchExit;
      while ((matchExit = regexExit.exec(remarks)) !== null) {
        const num = parseInt(matchExit[1]);
        const price = parseFloat(matchExit[2].replace(/,/g, ''));
        const qty = parseInt(matchExit[3]);
        const amt = Math.round(price * qty);
        extraExits[num] = { price, qty, amt };
      }

      const t3Price = extraTranches[3] ? extraTranches[3].price : t.entry3Price;
      const t3Qty = extraTranches[3] ? extraTranches[3].qty : t.entry3Qty;
      const t3Amt = extraTranches[3] ? extraTranches[3].amt : t.entry3Amt;

      const t4Price = extraTranches[4] ? extraTranches[4].price : t.entry4Price;
      const t4Qty = extraTranches[4] ? extraTranches[4].qty : t.entry4Qty;

      const t5Price = extraTranches[5] ? extraTranches[5].price : t.entry5Price;
      const t5Qty = extraTranches[5] ? extraTranches[5].qty : t.entry5Qty;

      const t6Price = extraTranches[6] ? extraTranches[6].price : t.entry6Price;
      const t6Qty = extraTranches[6] ? extraTranches[6].qty : t.entry6Qty;



      // Exits Breakdown calculations
      const ex1Price = extraExits[1] ? extraExits[1].price : t.exit1Price;
      const ex1Qty = extraExits[1] ? extraExits[1].qty : t.exit1Qty;

      const ex2Price = extraExits[2] ? extraExits[2].price : t.exit2Price;
      const ex2Qty = extraExits[2] ? extraExits[2].qty : t.exit2Qty;

      const ex3Price = extraExits[3] ? extraExits[3].price : t.exit3Price;
      const ex3Qty = extraExits[3] ? extraExits[3].qty : t.exit3Qty;

      const buildExitRow = (num, label, price, qty) => {
        return `
          <div style="display: grid; grid-template-columns: 85px 1fr 1fr; gap: 8px; align-items: center; background:rgba(255,255,255,.02); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line);">
            <span style="color:var(--gold); font-size: 11px; font-weight:600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${label}">${label}:</span>
            <input type="number" step="0.01" class="edit-exit-price" data-exit="${num}" value="${price != null ? price : ''}" style="width:100%; padding: 4px 6px; border-radius: 4px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-family: var(--mono);" placeholder="Price">
            <input type="number" class="edit-exit-qty" data-exit="${num}" value="${qty != null ? qty : ''}" style="width:100%; padding: 4px 6px; border-radius: 4px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-family: var(--mono);" placeholder="Qty">
          </div>
        `;
      };

      const defaultBrok = getDefaultTradeBrokerage(t);

      const totExitQty = [t.exit1Qty, t.exit2Qty, t.exit3Qty].reduce((s, q) => s + (Number(q) || 0), 0) + Object.values(extraExits).filter((e, idx) => idx >= 3).reduce((s, e) => s + e.qty, 0);
      const remainingQty = Number(t.totBuyQty || 0) - totExitQty;

      const totExitAmt = [
        ex1Price && ex1Qty ? Math.max(0, Math.round(ex1Price * ex1Qty - defaultBrok)) : 0,
        ex2Price && ex2Qty ? Math.max(0, Math.round(ex2Price * ex2Qty - defaultBrok)) : 0,
        ex3Price && ex3Qty ? Math.max(0, Math.round(ex3Price * ex3Qty - defaultBrok)) : 0
      ].reduce((s, a) => s + a, 0) + Object.values(extraExits).filter((e, idx) => idx >= 3).reduce((s, e) => s + Math.max(0, Math.round(e.price * e.qty - defaultBrok)), 0);

      const totBuyAmt = Number(t.totBuyAmt || 0);
      const totBuyQty = Number(t.totBuyQty || 1);
      const realizedCost = totBuyQty ? (totExitQty * (totBuyAmt / totBuyQty)) : 0;
      const realizedPnL = totExitQty > 0 ? Math.round(totExitAmt - realizedCost) : 0;
      const realizedPnLPct = realizedCost > 0 ? (realizedPnL / realizedCost) : 0;
      const capitalExposure = remainingQty * Number(t.avgBuyPrice || 0);

      const activeSL = (t.tslPrice != null && t.tslPrice !== '') ? Number(t.tslPrice) : Number(t.slPrice || 0);
      const expectedExitAmtOnRemaining = Math.max(0, Math.round(activeSL * remainingQty - (remainingQty > 0 ? defaultBrok : 0)));
      const remainingCost = totBuyAmt - realizedCost;
      const expectedPnLOnRemaining = remainingQty > 0 ? (expectedExitAmtOnRemaining - remainingCost) : 0;
      const expectedPnL = Math.round(expectedPnLOnRemaining + realizedPnL);

      $('#modalBody').innerHTML = `
    <div class="modal-head"><h3>Trade Details <span style="color:var(--dim);font-weight:400;font-size:12px;">· ID: ${t.id}</span></h3>
      <button class="close-x" id="mClose">✕</button></div>

    <div style="background: rgba(212,162,78,.06); border: 1px solid var(--line-soft); padding: 6px 12px; border-radius: 6px; margin-bottom: 12px;">
      <label style="display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer; color:var(--text); font-weight:600;">
        <input type="checkbox" id="m_isIntraday" ${t.tradeType === 'intraday' ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--gold);"> ⚡ Intraday Trade (Dhan Intraday Charges & Taxes)
      </label>
    </div>

    <div class="form-grid" style="margin-bottom:12px;">
      <div class="field"><label>Stock</label><input id="m_stock" value="${t.stock}" style="text-transform:uppercase;"></div>
      <div class="field"><label>Open Date</label><input type="date" id="m_openDate" value="${t.openDate}"></div>
      <div class="field"><label>Charges & STT (₹)</label><input type="number" step="0.01" id="m_brokerage" value="${getDefaultTradeBrokerage(t)}" ${t.brokerage != null && t.brokerage !== '' ? 'data-manual="true"' : ''}></div>
      <div class="field"><label>Initial SL (₹)</label><input type="number" step="0.01" id="m_slPrice" value="${t.slPrice || ''}"></div>
      <div class="field"><label>Trailing SL / TSL (₹)</label><input type="number" step="0.01" id="m_tslPrice" value="${t.tslPrice || ''}" style="border: 1px solid var(--gold); background: rgba(212,162,78,.03); color: var(--text);"></div>
      ${t.status === 'closed' ? `
        <div class="field"><label>Closed Date</label><input type="date" id="m_closedDate" value="${t.closedDate || ''}"></div>
      ` : ''}

      <div class="field readonly"><label>Avg Buy</label><input disabled value="${fmt(t.avgBuyPrice)}" id="m_avgBuyPrice"></div>
      <div class="field readonly"><label>Buy Qty</label><input disabled value="${fmt(t.totBuyQty)}" id="m_totBuyQty"></div>
      <div class="field readonly"><label>Buy Amount</label><input disabled value="${fmtRs(t.totBuyAmt)}" id="m_totBuyAmt"></div>
      <div class="field readonly"><label>Risk at SL</label><input disabled value="${fmtRs(t.totLossAtSL)}" id="m_riskAtSL"></div>
    </div>

    ${t.status === 'open' ? `
    <div style="background:rgba(255,255,255,.02); border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:14px; display:flex; flex-direction:column; gap:8px;">
      <h4 style="margin:0; font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; font-weight:600;">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${remainingQty > 0 ? 'var(--gold)' : 'var(--green)'};"></span>
        Active Exposure Summary
      </h4>
      <div class="active-exposure-grid">
        <div style="border-right:1px solid var(--line); padding-right:8px;">
          <div style="font-size:10px; color:var(--dim); text-transform:uppercase; margin-bottom:4px; font-weight:500;">Realized P/L</div>
          <div style="font-size:13px; font-family:var(--mono); font-weight:bold; color:${realizedPnL >= 0 ? 'var(--green)' : 'var(--red)'};">
            ${realizedPnL >= 0 ? '+' : ''}${fmtRs(realizedPnL)}
          </div>
        </div>
        <div style="border-right:1px solid var(--line); padding-right:8px;">
          <div style="font-size:10px; color:var(--dim); text-transform:uppercase; margin-bottom:4px; font-weight:500;">Shares in Hand</div>
          <div style="font-size:13px; font-family:var(--mono); font-weight:bold; color:var(--text);">
            ${remainingQty}
          </div>
        </div>
        <div style="border-right:1px solid var(--line); padding-right:8px;">
          <div style="font-size:10px; color:var(--dim); text-transform:uppercase; margin-bottom:4px; font-weight:500;">Expected P/L (SL/TSL)</div>
          <div id="m_expectedPnL_val" style="font-size:13px; font-family:var(--mono); font-weight:bold; color:${expectedPnL >= 0 ? 'var(--green)' : 'var(--red)'};">
            ${expectedPnL >= 0 ? '+' : ''}${fmtRs(expectedPnL)}
          </div>
        </div>
        <div>
          <div style="font-size:10px; color:var(--dim); text-transform:uppercase; margin-bottom:4px; font-weight:500;">Cap Exposure</div>
          <div style="font-size:13px; font-family:var(--mono); font-weight:bold; color:var(--text);">
            ${fmtRs(capitalExposure)}
          </div>
        </div>
      </div>
    </div>
    ` : ''}

    <div class="modal-two-col">
      <fieldset style="margin-top:0; padding:12px;">
        <legend>Buys Breakdown</legend>
        <div style="font-family:var(--sans); font-size:12px; display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto; padding-right: 4px;">
          <div style="display: grid; grid-template-columns: 85px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 2px; padding: 0 8px;">
            <span style="font-size: 10px; color: var(--dim); font-weight: bold; text-transform: uppercase;">Tranche</span>
            <span style="font-size: 10px; color: var(--dim); font-weight: bold; text-transform: uppercase;">Price (₹)</span>
            <span style="font-size: 10px; color: var(--dim); font-weight: bold; text-transform: uppercase;">Qty</span>
          </div>

          <!-- Tranche 1 -->
          ${buildTrancheRow(1, `T1 (${formatDateDMY(t.openDate)})`, t.entry1Price, t.entry1Qty)}

          <!-- Tranche 2 -->
          ${t.entry2Price ? buildTrancheRow(2, `T2${t.entry2Date ? ` (${formatDateDMY(t.entry2Date)})` : ''}`, t.entry2Price, t.entry2Qty) : ''}

          <!-- Tranche 3 -->
          ${t3Qty && t3Price ? buildTrancheRow(3, `T3${t.entry3Date || (extraTranches[3] && extraTranches[3].date) ? ` (${formatDateDMY(t.entry3Date || extraTranches[3].date)})` : ''}`, t3Price, t3Qty) : ''}

          <!-- Tranche 4 -->
          ${t4Qty && t4Price ? buildTrancheRow(4, `T4${t.entry4Date || (extraTranches[4] && extraTranches[4].date) ? ` (${formatDateDMY(t.entry4Date || extraTranches[4].date)})` : ''}`, t4Price, t4Qty) : ''}

          <!-- Tranche 5 -->
          ${t5Qty && t5Price ? buildTrancheRow(5, `T5${t.entry5Date || (extraTranches[5] && extraTranches[5].date) ? ` (${formatDateDMY(t.entry5Date || extraTranches[5].date)})` : ''}`, t5Price, t5Qty) : ''}

          <!-- Tranche 6 -->
          ${t6Qty && t6Price ? buildTrancheRow(6, `T6${t.entry6Date || (extraTranches[6] && extraTranches[6].date) ? ` (${formatDateDMY(t.entry6Date || extraTranches[6].date)})` : ''}`, t6Price, t6Qty) : ''}

          <!-- Extra Tranches -->
          ${Object.keys(extraTranches)
          .map(Number)
          .filter(num => num > 6)
          .sort((a, b) => a - b)
          .map(num => {
            const et = extraTranches[num];
            return buildTrancheRow(num, `T${num}${et.date ? ` (${formatDateDMY(et.date)})` : ''}`, et.price, et.qty);
          }).join('')}
        </div>
      </fieldset>

      <fieldset style="margin-top:0; padding:12px;">
        <legend>Exits Breakdown (${totExitQty}/${t.totBuyQty || 0})</legend>
        <div style="font-family:var(--sans); font-size:12px; display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto; padding-right: 4px;">
          <div style="display: grid; grid-template-columns: 85px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 2px; padding: 0 8px;">
            <span style="font-size: 10px; color: var(--dim); font-weight: bold; text-transform: uppercase;">Exit Leg</span>
            <span style="font-size: 10px; color: var(--dim); font-weight: bold; text-transform: uppercase;">Price (₹)</span>
            <span style="font-size: 10px; color: var(--dim); font-weight: bold; text-transform: uppercase;">Qty</span>
          </div>

          <!-- Exit 1 -->
          ${buildExitRow(1, 'Exit 1', ex1Price, ex1Qty)}

          <!-- Exit 2 -->
          ${ex2Price || ex2Qty || t.status === 'closed' ? buildExitRow(2, 'Exit 2', ex2Price, ex2Qty) : ''}

          <!-- Exit 3 -->
          ${ex3Price || ex3Qty ? buildExitRow(3, 'Exit 3', ex3Price, ex3Qty) : ''}

          <!-- Extra Exits -->
          ${Object.keys(extraExits)
          .map(Number)
          .filter(num => num > 3)
          .sort((a, b) => a - b)
          .map(num => {
            const ee = extraExits[num];
            return buildExitRow(num, `Exit ${num}`, ee.price, ee.qty);
          }).join('')}
        </div>
      </fieldset>
    </div>

    ${t.status === 'open' ? `
    <div class="modal-two-col">
      <fieldset style="margin-top:0; padding:12px;">
        <legend>Add pyramid entry</legend>
        <div class="form-grid" style="grid-template-columns: 1fr; gap: 8px;">
          <div class="field"><label>Price</label><input type="number" step="0.01" id="m_addPrice" value="${prefillPrice}"></div>
          <div class="field"><label>${qtyLabel}</label><input type="text" id="m_addQty" value="${prefillQty}" placeholder="e.g. 100 or 30%"></div>
          <div class="field"><label>Date</label><input type="date" id="m_addDate" value="${todayISO()}"></div>
          <div style="display: flex; gap: 8px; margin-top: 4px;">
            <button class="btn primary" id="m_planTranche" style="flex: 1; justify-content:center; white-space: nowrap;">Plan Next Tranche</button>
            <button class="btn primary" id="m_addLeg" style="flex: 1; justify-content:center;">Add Buy Leg</button>
          </div>
        </div>
      </fieldset>

      <fieldset style="margin-top:0; padding:12px;">
        <legend>Log Partial / Full Exit</legend>
        <div class="form-grid" style="grid-template-columns: 1fr; gap: 8px;">
          <div class="field"><label>Exit Price</label><input type="number" step="0.01" id="m_exitPrice"></div>
          <div class="field"><label>Exit Qty</label><input type="text" id="m_exitQty" value="${remainingQty}" placeholder="e.g. 100 or 50%"></div>
          <div class="field"><label>Exit Date</label><input type="date" id="m_exitDate" value="${todayISO()}"></div>
          <button class="btn primary" id="m_logExit" style="margin-top:4px; justify-content:center; background:var(--gold); border-color:var(--gold);">Log Sell Leg</button>
        </div>
      </fieldset>
    </div>
    ` : `
    <fieldset style="margin-bottom:14px; margin-top:0; padding:12px;">
      <legend>Closed Trade Summary</legend>
      <div class="form-grid c3" style="margin-bottom:12px; gap: 8px;">
        <div class="field readonly"><label>Total Exit Value</label><input disabled value="${fmtRs(t.totExitAmt)}"></div>
        <div class="field readonly"><label>Avg Sell Price</label><input disabled value="${aggregateExit(normalizeTrade(t)).avgSellPrice != null ? fmt(aggregateExit(normalizeTrade(t)).avgSellPrice) : '—'}"></div>
        <div class="field readonly"><label>Brokerage</label><input disabled value="${fmtRs(getDefaultTradeBrokerage(t))}"></div>
        <div class="field readonly"><label>Net P/L</label><input disabled value="${fmtRs(t.pnl)}" style="color:${t.pnl >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:bold;"></div>
        <div class="field readonly"><label>P/L %</label><input disabled value="${fmtPct(t.pnlPct)}" style="color:${t.pnl >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:bold;"></div>
        <div class="field readonly"><label>R:R Ratio</label><input disabled value="${t.rr == null ? '—' : t.rr}"></div>
        <div class="field readonly"><label>Holding Period</label><input disabled value="${t.days == null ? '—' : t.days + ' days'}"></div>
        <div class="field readonly"><label>Closed Date</label><input disabled value="${formatDateDMY(t.closedDate)}"></div>
      </div>
    </fieldset>
    `}

    <div class="field" style="margin-bottom:12px;"><label>Setup Strategy</label><input type="text" id="m_setup" value="${t.setup || ''}" placeholder="e.g. VCP, Pullback, Cheat"></div>
    <div class="field" style="margin-bottom:12px;"><label>Remarks</label><textarea rows="2" id="m_remarks" placeholder="Setup notes, trading plan, lessons...">${t.remarks || ''}</textarea></div>
    
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn primary" id="m_updateRemarks" style="background:#2563eb; color:#fff; font-weight:600; padding:8px 18px;">Save</button>
      <button class="btn danger ghost" id="m_delete" style="margin-left:auto;">Delete Trade</button>
    </div>
  `;
      $('#modalBg').classList.add('show');
      $('#mClose').onclick = closeModal;
      $('#modalBg').onclick = (e) => { if (e.target.id === 'modalBg') closeModal(); };

      const updateModalPnLAndRisk = () => {
        const brokInputVal = parseFloat($('#m_brokerage')?.value);
        const currentTotalBrok = !isNaN(brokInputVal) ? brokInputVal : getDefaultTradeBrokerage(t);
        const counts = getTradeTrancheCounts(t);
        const perLegBrok = counts.totalCount ? (currentTotalBrok / counts.totalCount) : currentTotalBrok;

        // Read tranche buy inputs dynamically
        const priceInputs = Array.from(document.querySelectorAll('.edit-buy-price'));
        const qtyInputs = Array.from(document.querySelectorAll('.edit-buy-qty'));
        const tranchesData = {};

        priceInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-tranche'));
          const val = parseFloat(input.value);
          if (!tranchesData[num]) tranchesData[num] = {};
          tranchesData[num].price = isNaN(val) ? null : val;
        });

        qtyInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-tranche'));
          const val = parseInt(input.value);
          if (!tranchesData[num]) tranchesData[num] = {};
          tranchesData[num].qty = isNaN(val) ? null : val;
        });

        let tempTotQty = 0;
        let tempTotAmt = 0;
        let tempExecAmt = 0;

        Object.keys(tranchesData)
          .map(Number)
          .sort((a, b) => a - b)
          .forEach(num => {
            const tr = tranchesData[num] || {};
            if (tr.price != null && tr.qty) {
              tempTotQty += tr.qty;
              tempTotAmt += Math.round(tr.price * tr.qty + perLegBrok);
              tempExecAmt += tr.price * tr.qty;
            }
          });

        const tempAvgBuy = tempTotQty ? +(tempExecAmt / tempTotQty).toFixed(2) : 0;

        // Read exit leg inputs dynamically
        const exitPriceInputs = Array.from(document.querySelectorAll('.edit-exit-price'));
        const exitQtyInputs = Array.from(document.querySelectorAll('.edit-exit-qty'));
        const exitLegsData = {};

        exitPriceInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-exit'));
          const val = parseFloat(input.value);
          if (!exitLegsData[num]) exitLegsData[num] = {};
          exitLegsData[num].price = isNaN(val) ? null : val;
        });

        exitQtyInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-exit'));
          const val = parseInt(input.value);
          if (!exitLegsData[num]) exitLegsData[num] = {};
          exitLegsData[num].qty = isNaN(val) ? null : val;
        });

        let tempTotExitQty = 0;
        let tempTotExitAmt = 0;
        let tempTotExitGrossAmt = 0;

        Object.keys(exitLegsData)
          .map(Number)
          .sort((a, b) => a - b)
          .forEach(num => {
            const exLeg = exitLegsData[num] || {};
            if (exLeg.price != null && exLeg.qty) {
              tempTotExitQty += exLeg.qty;
              tempTotExitGrossAmt += exLeg.price * exLeg.qty;
              tempTotExitAmt += Math.max(0, Math.round(exLeg.price * exLeg.qty - perLegBrok));
            }
          });

        const isIntraday = $('#m_isIntraday')?.checked;
        const mBrokEl = $('#m_brokerage');
        if (mBrokEl && mBrokEl.getAttribute('data-manual') !== 'true' && tempExecAmt > 0) {
          const autoCharges = calcTradeCharges(tempExecAmt, tempTotExitGrossAmt > 0 ? tempTotExitGrossAmt : tempExecAmt, isIntraday);
          mBrokEl.value = autoCharges;
        }

        // Update read-only inputs in real-time
        if ($('#m_avgBuyPrice')) $('#m_avgBuyPrice').value = fmt(tempAvgBuy);
        if ($('#m_totBuyQty')) $('#m_totBuyQty').value = fmt(tempTotQty);
        if ($('#m_totBuyAmt')) $('#m_totBuyAmt').value = fmtRs(tempTotAmt);

        // Recalculate PnL and Risk
        const slInput = $('#m_slPrice');
        const tslInput = $('#m_tslPrice');
        const sl = slInput ? parseFloat(slInput.value) || 0 : 0;
        const tsl = tslInput ? parseFloat(tslInput.value) : NaN;
        const activeSL = !isNaN(tsl) && tsl !== 0 ? tsl : sl;

        const tempRemainingQty = Math.max(0, tempTotQty - tempTotExitQty);
        const tempRealizedCost = tempTotQty ? (tempTotExitQty * (tempTotAmt / tempTotQty)) : 0;
        const tempRealizedPnL = tempTotExitQty > 0 ? Math.round(tempTotExitAmt - tempRealizedCost) : 0;

        const defaultPerOrder = getSettingBrokerage();

        // Re-calculate Expected P/L in real-time
        const expectedExitAmtOnRemaining = Math.max(0, Math.round(activeSL * tempRemainingQty - (tempRemainingQty > 0 ? defaultPerOrder : 0)));
        const remainingCost = tempTotAmt - tempRealizedCost;
        const expectedPnLOnRemaining = tempRemainingQty > 0 ? (expectedExitAmtOnRemaining - remainingCost) : 0;
        const expected = Math.round(expectedPnLOnRemaining + tempRealizedPnL);

        const valEl = $('#m_expectedPnL_val');
        if (valEl) {
          valEl.textContent = (expected >= 0 ? '+' : '') + fmtRs(expected);
          valEl.style.color = expected >= 0 ? 'var(--green)' : 'var(--red)';
        }

        // Re-calculate Risk at SL in real-time
        const slPerShare = Number((tempAvgBuy - sl).toFixed(4));
        const totLossAtSL = Math.round((tempAvgBuy - sl) * tempTotQty + currentTotalBrok + (tempRemainingQty > 0 ? defaultPerOrder : 0));
        const riskEl = $('#m_riskAtSL');
        if (riskEl) {
          riskEl.value = fmtRs(totLossAtSL);
        }
      };

          if (t.entry4Qty && t.entry4Price) activeTrancheCount++;
          if (t.entry5Qty && t.entry5Price) activeTrancheCount++;
          if (t.entry6Qty && t.entry6Price) activeTrancheCount++;

          let nextPct = 0.50;
          if (activeTrancheCount === 1) nextPct = 0.30;
          else if (activeTrancheCount === 2) nextPct = 0.20;
          else if (activeTrancheCount >= 3) nextPct = 0.20;

          let lastEntryPrice = t.entry1Price;
          if (t.entry2Price) lastEntryPrice = t.entry2Price;
          if (t.entry3Price) lastEntryPrice = t.entry3Price;
          if (t.entry4Price) lastEntryPrice = t.entry4Price;
          if (t.entry5Price) lastEntryPrice = t.entry5Price;

          const addPriceEl = $('#m_addPrice');
          const customPrice = addPriceEl ? parseFloat(addPriceEl.value) : NaN;
          const planPrice = !isNaN(customPrice) && customPrice > 0 ? customPrice : (lastEntryPrice || '');

          STATE.prefillPlan = {
            stock: t.stock,

      const addLegBtn = $('#m_addLeg');
      if (addLegBtn) {
        addLegBtn.onclick = async () => {
          const price = parseFloat($('#m_addPrice').value), qty = parseFloat($('#m_addQty').value);
          const date = $('#m_addDate').value;
          const defaultPerOrder = getSettingBrokerage();
          const oldCounts = getTradeTrancheCounts(t);
          const userBrokVal = parseFloat($('#m_brokerage')?.value);
          const totalBrok = (!isNaN(userBrokVal) && userBrokVal !== (defaultPerOrder * oldCounts.totalCount))
            ? userBrokVal
            : defaultPerOrder * (oldCounts.totalCount + 1);
          const perLegBrok = totalBrok / (oldCounts.totalCount + 1);

          if (isNaN(price) || isNaN(qty)) { toast('Enter price and qty', 'err'); return; }
          const updated = { ...t, brokerage: totalBrok };
          if (!updated.entry2Price) {
            updated.entry2Price = price;
            updated.entry2Qty = qty;
            updated.entry2Amt = Math.round(price * qty + perLegBrok);
            updated.entry2Date = date;
          }
          else if (!updated.entry3Price) {
            updated.entry3Price = price;
            updated.entry3Qty = qty;
            updated.entry3Amt = Math.round(price * qty + perLegBrok);
            updated.entry3Date = date;
          }
          else if (!updated.entry4Price) {
            updated.entry4Price = price;
            updated.entry4Qty = qty;
            updated.entry4Amt = Math.round(price * qty + perLegBrok);
            updated.entry4Date = date;
          }
          else if (!updated.entry5Price) {
            updated.entry5Price = price;
            updated.entry5Qty = qty;
            updated.entry5Amt = Math.round(price * qty + perLegBrok);
            updated.entry5Date = date;
          }
          else if (!updated.entry6Price) {
            updated.entry6Price = price;
            updated.entry6Qty = qty;
            updated.entry6Amt = Math.round(price * qty + perLegBrok);
            updated.entry6Date = date;
          }
          else {
            const oldQty = Number(updated.entry6Qty || 0);
            const oldAmt = Number(updated.entry6Amt || 0);
            const newQty = oldQty + qty;
            const newAmt = oldAmt + Math.round(price * qty + perLegBrok);
            const newPrice = newQty ? +(newAmt / newQty).toFixed(2) : 0;

            let remarksStr = updated.remarks || '';
            if (updated.entry6Price && !remarksStr.includes('[Tranche 6:')) {
              const e6d = updated.entry6Date ? ` on ${formatDateDMY(updated.entry6Date)}` : '';
              remarksStr = remarksStr.trim() + (remarksStr ? '\n' : '') + `[Tranche 6: ₹${Number(updated.entry6Price).toFixed(2)} × ${updated.entry6Qty}${e6d}]`;
            }
            const matches = remarksStr.match(/\[Tranche \d+:/g) || [];
            const nextNum = 6 + matches.length;
            remarksStr = remarksStr.trim() + '\n' + `[Tranche ${nextNum}: ₹${price.toFixed(2)} × ${qty} on ${formatDateDMY(date)}]`;

            updated.remarks = remarksStr;
            updated.entry6Price = newPrice;
            updated.entry6Qty = newQty;
            updated.entry6Amt = newAmt;
            if (!updated.entry6Date) {
              updated.entry6Date = date;
            }
          }
          const buy = aggregateBuy(normalizeTrade(updated));
          updated.totBuyQty = buy.totBuyQty; updated.totBuyAmt = buy.totBuyAmt; updated.avgBuyPrice = buy.avgBuyPrice;

          // Re-calculate Expected P/L for open position
          const pnlData = computeOpenTradePnL(updated);
          updated.pnl = pnlData.pnl;
          updated.pnlPct = pnlData.pnlPct;

          const normUpdated = normalizeTrade(updated);

          saveLocalState();

      const logExitBtn = $('#m_logExit');
      if (logExitBtn) {
        logExitBtn.onclick = async () => {
          const price = parseFloat($('#m_exitPrice').value);
          const qty = parseFloat($('#m_exitQty').value);
          const date = $('#m_exitDate').value;
          const defaultPerOrder = getSettingBrokerage();
          const oldCounts = getTradeTrancheCounts(t);
          const userBrokVal = parseFloat($('#m_brokerage')?.value);
          const totalBrok = (!isNaN(userBrokVal) && userBrokVal !== (defaultPerOrder * oldCounts.totalCount))
            ? userBrokVal
            : defaultPerOrder * (oldCounts.totalCount + 1);

          if (isNaN(price) || isNaN(qty)) { toast('Enter exit price and qty', 'err'); return; }

          const updated = { ...t, brokerage: totalBrok };

          if (!updated.exit1Price) {
            updated.exit1Price = price;
            updated.exit1Qty = qty;
          } else if (!updated.exit2Price) {
            updated.exit2Price = price;
            updated.exit2Qty = qty;
          } else if (!updated.exit3Price) {
            updated.exit3Price = price;
            updated.exit3Qty = qty;
          } else {
            const oldQty = Number(updated.exit3Qty || 0);
            const oldVal = Number(updated.exit3Price || 0) * oldQty;
            const newVal = price * qty;
            const newQty = oldQty + qty;
            const newPrice = newQty ? Number(((oldVal + newVal) / newQty).toFixed(2)) : 0;

            let remarksStr = updated.remarks || '';
            if (updated.exit3Price && !remarksStr.includes('[Exit 3:')) {
              remarksStr = remarksStr.trim() + (remarksStr ? '\n' : '') + `[Exit 3: ₹${Number(updated.exit3Price).toFixed(2)} × ${updated.exit3Qty}]`;
            }
            const matches = remarksStr.match(/\[Exit \d+:/g) || [];
            const nextNum = 3 + matches.length;
            remarksStr = remarksStr.trim() + '\n' + `[Exit ${nextNum}: ₹${price.toFixed(2)} × ${qty}]`;

            updated.remarks = remarksStr;
            updated.exit3Price = newPrice;
            updated.exit3Qty = newQty;
          }

          const ex = aggregateExit(normalizeTrade(updated));
          updated.totExitAmt = ex.totExitAmt;
          const totalExitQty = ex.totExitQty;
          updated.remarks = $('#m_remarks').value.trim() + (updated.remarks !== t.remarks ? '\n' + updated.remarks.replace(t.remarks, '').trim() : '');

          if (totalExitQty >= (updated.totBuyQty || 0)) {
            updated.status = 'closed';
            updated.closedDate = date;
            updated.pnl = Math.round(updated.totExitAmt - (updated.totBuyAmt || 0));
            updated.pnlPct = updated.totBuyAmt ? updated.pnl / updated.totBuyAmt : null;
            const opened = new Date(updated.openDate), closed = new Date(updated.closedDate);
            updated.days = isNaN(opened) || isNaN(closed) ? null : Math.round((closed - opened) / 86400000);
            updated.rr = updated.totLossAtSL ? +(updated.pnl / updated.totLossAtSL).toFixed(2) : null;
          } else {
            updated.status = 'open';
            updated.closedDate = '';

            // Re-calculate Expected P/L for open position
            const pnlData = computeOpenTradePnL(updated);
            updated.pnl = pnlData.pnl;
            updated.pnlPct = pnlData.pnlPct;

            updated.days = '';
            updated.rr = updated.totLossAtSL ? +(updated.pnl / updated.totLossAtSL).toFixed(2) : null;

          const normUpdated = normalizeTrade(updated);

      $('#m_updateRemarks').onclick = async () => {
        const stockName = $('#m_stock').value.trim().toUpperCase();
        const openDate = $('#m_openDate').value;
        const closedDateInput = $('#m_closedDate')?.value;
        const userBrokVal = parseFloat($('#m_brokerage')?.value);
        const totalBrok = !isNaN(userBrokVal) ? userBrokVal : getDefaultTradeBrokerage(t);
        const counts = getTradeTrancheCounts(t);
        const perLegBrok = counts.totalCount ? (totalBrok / counts.totalCount) : totalBrok;

        if (!stockName) { toast('Stock name is required', 'err'); return; }
        if (!openDate) { toast('Open date is required', 'err'); return; }

        const updated = {
          ...t,
          stock: stockName,
          openDate: openDate,
          brokerage: totalBrok,
          tradeType: $('#m_isIntraday')?.checked ? 'intraday' : 'delivery',
          setup: $('#m_setup').value.trim(),
          remarks: $('#m_remarks').value.trim()
        };

        if (closedDateInput) {
          updated.closedDate = closedDateInput;
        }

        // 1. Read buy tranche inputs dynamically
        const buyPriceInputs = Array.from(document.querySelectorAll('.edit-buy-price'));
        const buyQtyInputs = Array.from(document.querySelectorAll('.edit-buy-qty'));
        const tranchesData = {};

        buyPriceInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-tranche'));
          const val = parseFloat(input.value);
          if (!tranchesData[num]) tranchesData[num] = {};
          tranchesData[num].price = isNaN(val) ? null : val;
        });

        buyQtyInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-tranche'));
          const val = parseInt(input.value);
          if (!tranchesData[num]) tranchesData[num] = {};
          tranchesData[num].qty = isNaN(val) ? null : val;
        });

        // Set Tranches 1 to 6
        for (let i = 1; i <= 6; i++) {
          const tr = tranchesData[i];
          if (tr && tr.price != null && tr.qty) {
            updated[`entry${i}Price`] = tr.price;
            updated[`entry${i}Qty`] = tr.qty;
            updated[`entry${i}Amt`] = Math.round(tr.price * tr.qty + perLegBrok);
            if (i > 1 && !updated[`entry${i}Date`]) {
              updated[`entry${i}Date`] = t[`entry${i}Date`] || todayISO();
            }
          } else {
            updated[`entry${i}Price`] = null;
            updated[`entry${i}Qty`] = null;
            updated[`entry${i}Amt`] = null;
            if (i > 1) updated[`entry${i}Date`] = '';
          }
        }

        // Process Tranches 7+
        const t7AndAbove = [];
        Object.keys(tranchesData).map(Number).filter(num => num >= 7).sort((a, b) => a - b).forEach(num => {
          const tr = tranchesData[num] || {};
          if (tr.price != null && tr.qty) {
            t7AndAbove.push({ num, price: tr.price, qty: tr.qty });
          }
        });

        // 2. Read exit leg inputs dynamically
        const exitPriceInputs = Array.from(document.querySelectorAll('.edit-exit-price'));
        const exitQtyInputs = Array.from(document.querySelectorAll('.edit-exit-qty'));
        const exitsData = {};

        exitPriceInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-exit'));
          const val = parseFloat(input.value);
          if (!exitsData[num]) exitsData[num] = {};
          exitsData[num].price = isNaN(val) ? null : val;
        });

        exitQtyInputs.forEach(input => {
          const num = parseInt(input.getAttribute('data-exit'));
          const val = parseInt(input.value);
          if (!exitsData[num]) exitsData[num] = {};
          exitsData[num].qty = isNaN(val) ? null : val;
        });

        // Set Exits 1 to 3
        for (let i = 1; i <= 3; i++) {
          const exLeg = exitsData[i];
          if (exLeg && exLeg.price != null && exLeg.qty) {
            updated[`exit${i}Price`] = exLeg.price;
            updated[`exit${i}Qty`] = exLeg.qty;
          } else {
            updated[`exit${i}Price`] = null;
            updated[`exit${i}Qty`] = null;
          }
        }

        // Process Exits 4+
        const ex4AndAbove = [];
        Object.keys(exitsData).map(Number).filter(num => num >= 4).sort((a, b) => a - b).forEach(num => {
          const exLeg = exitsData[num] || {};
          if (exLeg.price != null && exLeg.qty) {
            ex4AndAbove.push({ num, price: exLeg.price, qty: exLeg.qty });
          }
        });

        // Clean and update remarks for Tranches 7+ and Exits 4+
        let remarksText = updated.remarks;
        remarksText = remarksText.replace(/\[Tranche \d+:[^\]]+\]\r?\n?/g, '').replace(/\[Exit \d+:[^\]]+\]\r?\n?/g, '').trim();

        if (t7AndAbove.length > 0) {
          const trancheLines = t7AndAbove.map(ta => {
            let dStr = extraTranches[ta.num] && extraTranches[ta.num].date ? ` on ${formatDateDMY(extraTranches[ta.num].date)}` : '';
            return `[Tranche ${ta.num}: ₹${ta.price.toFixed(2)} × ${ta.qty}${dStr}]`;
          });
          remarksText = remarksText + (remarksText ? '\n' : '') + trancheLines.join('\n');
        }

        if (ex4AndAbove.length > 0) {
          const exitLines = ex4AndAbove.map(ea => `[Exit ${ea.num}: ₹${ea.price.toFixed(2)} × ${ea.qty}]`);
          remarksText = remarksText + (remarksText ? '\n' : '') + exitLines.join('\n');
        }

        updated.remarks = remarksText;

        // Aggregate buy and exit totals
        const buy = aggregateBuy(normalizeTrade(updated));
        updated.totBuyQty = buy.totBuyQty;
        updated.totBuyAmt = buy.totBuyAmt;
        updated.avgBuyPrice = buy.avgBuyPrice;

        const ex = aggregateExit(normalizeTrade(updated));
        updated.totExitAmt = ex.totExitAmt;
        const totExitQty = ex.totExitQty;

        // Handle SL / TSL inputs
        const slInput = $('#m_slPrice');
        const tslInput = $('#m_tslPrice');

        if (slInput) {
          const newSl = parseFloat(slInput.value);
          updated.slPrice = isNaN(newSl) ? null : newSl;
        }
        if (tslInput) {
          const newTsl = parseFloat(tslInput.value);
          updated.tslPrice = isNaN(newTsl) ? '' : newTsl;
        }

        if (updated.slPrice != null && !isNaN(updated.slPrice) && updated.avgBuyPrice) {
          const slPerShare = Number((updated.avgBuyPrice - updated.slPrice).toFixed(4));
          updated.slPerShare = slPerShare;
          updated.slPct = updated.avgBuyPrice ? slPerShare / updated.avgBuyPrice : null;
          updated.totLossAtSL = Math.round(Number(updated.totBuyQty || 0) * slPerShare);
        } else {
          updated.slPerShare = null;
          updated.slPct = null;
          updated.totLossAtSL = null;
        }

        // Handle trade status and PnL
        if (totExitQty >= (updated.totBuyQty || 0) && (updated.totBuyQty || 0) > 0) {
          updated.status = 'closed';
          updated.closedDate = updated.closedDate || t.closedDate || todayISO();
          updated.pnl = Math.round(Number(updated.totExitAmt || 0) - Number(updated.totBuyAmt || 0));
          updated.pnlPct = updated.totBuyAmt ? updated.pnl / updated.totBuyAmt : null;
          const opened = new Date(updated.openDate), closed = new Date(updated.closedDate);
          updated.days = isNaN(opened) || isNaN(closed) ? null : Math.round((closed - opened) / 86400000);
          updated.rr = updated.totLossAtSL ? +(updated.pnl / updated.totLossAtSL).toFixed(2) : null;
        } else {
          updated.status = 'open';
          updated.closedDate = '';
          const pnlData = computeOpenTradePnL(updated);
          updated.pnl = pnlData.pnl;
          updated.pnlPct = pnlData.pnlPct;
          updated.days = '';
          updated.rr = updated.totLossAtSL ? +(updated.pnl / updated.totLossAtSL).toFixed(2) : null;
        }

        const normUpdated = normalizeTrade(updated);
        const idx = STATE.trades.findIndex(tr => String(tr.id) === String(updated.id));
        if (idx !== -1) STATE.trades[idx] = normUpdated;
        saveLocalState();
        toast('Trade details saved successfully!', 'ok');
        closeModal();
        renderShell();
        apiPost({ action: 'updateTrade', trade: updated }).catch(err => { toast('Sync failed: ' + err.message, 'err'); });
      };

      $('#m_delete').onclick = async () => {
        if (!confirm('Delete this trade permanently?')) return;
        STATE.trades = STATE.trades.filter(tr => String(tr.id) !== String(t.id));
        saveLocalState();
        toast('Trade deleted', 'ok');
        closeModal();
        renderShell();
        apiPost({ action: 'deleteTrade', id: t.id }).catch(err => { toast('Sync failed: ' + err.message, 'err'); });
      };
    }

          const newPrice = newQty ? +(newAmt / newQty).toFixed(2) : 0;

          if (updated.entry6Price && !remarksStr.includes('[Tranche 6:')) {
            const e6d = updated.entry6Date ? ` on ${formatDateDMY(updated.entry6Date)}` : '';
            remarksStr = remarksStr.trim() + (remarksStr ? '\n' : '') + `[Tranche 6: ₹${Number(updated.entry6Price).toFixed(2)} × ${updated.entry6Qty}${e6d}]`;
          }
          const matches = remarksStr.match(/\[Tranche \d+:/g) || [];
          const nextNum = 6 + matches.length;
          remarksStr = remarksStr.trim() + '\n' + `[Tranche ${nextNum}: ₹${price.toFixed(2)} × ${qty} on ${formatDateDMY(date)}]`;

          updated.remarks = remarksStr;
          updated.entry6Price = newPrice;
          updated.entry6Qty = newQty;
          updated.entry6Amt = newAmt;
          if (!updated.entry6Date) {
            updated.entry6Date = date;
          }
        }

        updated.totBuyQty = buy.totBuyQty;
        updated.totBuyAmt = buy.totBuyAmt;
        updated.avgBuyPrice = buy.avgBuyPrice;

        const pnlData = computeOpenTradePnL(updated);
        updated.pnl = pnlData.pnl;
        updated.pnlPct = pnlData.pnlPct;
        if (updated.totLossAtSL) updated.rr = +(updated.pnl / updated.totLossAtSL).toFixed(2);

        updated.remarks = (updated.remarks || '').trim() + (updated.remarks ? '\n' : '') + wlRemark;

        const normUpdated = normalizeTrade(updated);
        const trIdx = STATE.trades.findIndex(tr => String(tr.id) === String(updated.id));
        if (trIdx !== -1) STATE.trades[trIdx] = normUpdated;

          apiPost({ action: 'updateTrade', trade: updated }),
          apiPost({ action: 'updateWatchlist', rows: wl })
        ]).catch(err => { toast('Sync failed: ' + err.message, 'err'); });

        const c = computeEntryCalc({
          capital: cap,
          riskPct,
          entryPct: item.entryPct,
          entryPrice: item.entryPrice,
          slPrice: item.slPrice,
          brokerage: getSettingBrokerage()

        const userQty = parseFloat($('#r_qty').value);

    function formatFY(fyStr) {
      if (!fyStr) return "";
      const parts = fyStr.split('-');
      if (parts.length === 2) {
        let start = parts[0].trim();
        let end = parts[1].trim();
        if (end.length === 2) {
          end = start.slice(0, 2) + end;
        }
        return `${start}-${end}`;
      }
      return fyStr;
    }

    function calculateActiveYearAverageCapital() {
      const opening = Number(STATE.settings.openingCapitalFY || 0);
      const startDateStr = STATE.settings.currentFY ? (STATE.settings.currentFY.split('-')[0] + '-04-01') : '2026-04-01';
      const start = new Date(startDateStr);
      const end = new Date(); // today

      if (isNaN(start.getTime())) return opening;

      const totalMs = end - start;
      if (totalMs <= 0) return opening;
      const totalDays = Math.max(1, Math.ceil(totalMs / (1000 * 60 * 60 * 24)));

      const transactions = [];

      // Capital additions
      STATE.capitalLog.filter(c => !/opening/i.test(c.note || '')).forEach(c => {
        const d = new Date(c.date);
        const offset = Math.floor((d - start) / (1000 * 60 * 60 * 24));
        transactions.push({ day: offset, amount: Number(c.amount || 0) });
      });

      // Trade P/Ls
      STATE.trades.filter(t => t.status === 'closed' && t.closedDate).forEach(t => {
        const d = new Date(t.closedDate);
        const offset = Math.floor((d - start) / (1000 * 60 * 60 * 24));
        transactions.push({ day: offset, amount: Number(t.pnl || 0) });
      });

      // Expenses
      STATE.expenses.forEach(e => {
        const d = new Date(e.date);
        const offset = Math.floor((d - start) / (1000 * 60 * 60 * 24));
        transactions.push({ day: offset, amount: -Number(e.amount || 0) });
      });

      transactions.sort((a, b) => a.day - b.day);

      let currentCap = opening;
      let timeWeightedSum = 0;
      let lastDay = 0;

      transactions.forEach(tx => {
        const targetDay = Math.min(totalDays, Math.max(0, tx.day));
        if (targetDay > lastDay) {
          timeWeightedSum += currentCap * (targetDay - lastDay);
          lastDay = targetDay;
        }
        currentCap += tx.amount;
      });

      if (totalDays > lastDay) {
        timeWeightedSum += currentCap * (totalDays - lastDay);
      }

      return timeWeightedSum / totalDays;
    }

    function getMultiYearRowsWithLive() {
      const rows = STATE.multiYear.map(r => ({ ...r, isLive: false }));
      const activeFYLabel = formatFY(STATE.settings.currentFY);
      if (activeFYLabel) {
        const s = overviewStats();
        const netPnl = s.netPnlFY;

        // Use dynamic average capital as base
        const avgCapital = calculateActiveYearAverageCapital();
        const returnPct = avgCapital ? (netPnl / avgCapital) * 100 : 0;

        const idx = rows.findIndex(r => formatFY(r.year) === activeFYLabel);
        if (idx !== -1) {
          rows[idx].year = activeFYLabel;
          rows[idx].openingCap = avgCapital;
          rows[idx].pnl = netPnl;
          rows[idx].returnPct = returnPct;

            openingCap: avgCapital,
            pnl: netPnl,
            returnPct: returnPct,
            isLive: true
          });
        }

      // Sort chronological by starting year
      rows.sort((a, b) => {
        const startA = parseInt(a.year.split('-')[0]) || 0;
        const startB = parseInt(b.year.split('-')[0]) || 0;
        return startA - startB;
      });

      // Calculate Cumulative PnL and Compounded Cumulative Return %
      let runningCumPnl = 0;
      let compoundFactor = 1.0;
      rows.forEach(r => {
        runningCumPnl += Number(r.pnl || 0);
        r.cumPnl = runningCumPnl;
        const rPct = Number(r.returnPct || 0);
        compoundFactor *= (1 + rPct / 100);
        r.cumReturnPct = (compoundFactor - 1) * 100;
      });

      return rows;
    }

          }
          renderMultiYear(host);
        };
      });

      $('#addYearBtn').onclick = () => {
        STATE.multiYear.push({ year: '', openingCap: 0, pnl: 0, returnPct: 0 });
        renderMultiYear(host);
      };

      $('#saveYearsBtn').onclick = async () => {
        const updatedRows = [];
        document.querySelectorAll('#myBody tr').forEach((tr, index) => {
          const row = rows[index];
          if (row.isLive) {
            updatedRows.push({
              year: row.year,
              openingCap: row.openingCap,
              pnl: row.pnl,
              returnPct: row.returnPct
            });
          } else {
            const yearInp = tr.querySelector('[data-k="year"]');
            const openingInp = tr.querySelector('[data-k="openingCap"]');
            const pnlInp = tr.querySelector('[data-k="pnl"]');
            const retInp = tr.querySelector('[data-k="returnPct"]');

            updatedRows.push({
              year: yearInp.value,
              openingCap: parseFloat(openingInp.value) || 0,
              pnl: parseFloat(pnlInp.value) || 0,
              returnPct: parseFloat(retInp.value) || 0
            });
          }
        });

        STATE.multiYear = updatedRows;
        saveLocalState();
        toast('Saved', 'ok');
        renderShell();
        apiPost({ action: 'updateMultiYear', rows: updatedRows }).catch(err => toast('Sync failed: ' + err.message, 'err'));
      };

      drawMultiYearCharts(chronologicalRows);
    }

    let _myEquityChart = null;
    let _myPnlCurveChart = null;
    let _myReturnsChart = null;
    function drawMultiYearCharts(rows) {
      const canvasEq = $('#myEquityChart');
      const canvasPnlCurve = $('#myPnlCurveChart');
      const canvasRet = $('#myReturnsChart');
      if (!canvasEq || !canvasPnlCurve || !canvasRet) return;

      const sorted = rows.slice().sort((a, b) => {
        const yearA = parseInt(a.year.split('-')[0]) || 0;
        const yearB = parseInt(b.year.split('-')[0]) || 0;
        return yearA - yearB;
      });

      // 1. Capital Curve Data
      const eqLabels = [];
      const eqData = [];
      if (sorted.length > 0) {
        eqLabels.push("Start (" + sorted[0].year.split('-')[0] + ")");
        eqData.push(Number(sorted[0].openingCap));

        sorted.forEach(r => {
          eqLabels.push(r.year);
          eqData.push(Math.round(Number(r.openingCap) + Number(r.pnl)));
        });
      }

      // 2. Cumulative P/L Curve Data
      const pnlCurveLabels = [];
      const pnlCurveData = [];
      if (sorted.length > 0) {
        pnlCurveLabels.push("Start");
        pnlCurveData.push(0);

        let cumPnl = 0;
        sorted.forEach(r => {
          cumPnl += Number(r.pnl || 0);
          pnlCurveLabels.push(r.year);
          pnlCurveData.push(Math.round(cumPnl));
        });
      }

      // 3. Annual P/L Bar Chart Data
      const retLabels = sorted.map(r => r.year);
      const retData = sorted.map(r => Math.round(Number(r.pnl) * 100) / 100);
      const retColors = retData.map(v => v >= 0 ? '#33d17a' : '#ff5c5c');
      const retBgColors = retData.map(v => v >= 0 ? 'rgba(51,209,122,.25)' : 'rgba(255,92,92,.25)');

      // Render Capital Curve
      if (_myEquityChart) _myEquityChart.destroy();
      _myEquityChart = new Chart(canvasEq.getContext('2d'), {
        type: 'line',
        data: {
          labels: eqLabels,
          datasets: [{
            data: eqData,
            borderColor: '#d4a24e',
            backgroundColor: 'rgba(212,162,78,.12)',
            fill: true,
            tension: 0.2,
            pointRadius: 4,
            pointBackgroundColor: '#d4a24e',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1a212c' }, ticks: { color: '#5b6576' } },
            y: {
              grid: { color: '#1a212c' },
              ticks: {
                color: '#5b6576',
                callback: function (value) { return '₹' + Number(value).toLocaleString('en-IN'); }
              }
            }
          }
        }
      });

      // Render Cumulative P/L Curve
      if (_myPnlCurveChart) _myPnlCurveChart.destroy();
      _myPnlCurveChart = new Chart(canvasPnlCurve.getContext('2d'), {
        type: 'line',
        data: {
          labels: pnlCurveLabels,
          datasets: [{
            data: pnlCurveData,
            borderColor: '#33d17a',
            backgroundColor: 'rgba(51,209,122,.12)',
            fill: true,
            tension: 0.2,
            pointRadius: 4,
            pointBackgroundColor: '#33d17a',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1a212c' }, ticks: { color: '#5b6576' } },
            y: {
              grid: { color: '#1a212c' },
              ticks: {
                color: '#5b6576',
                callback: function (value) { return '₹' + Number(value).toLocaleString('en-IN'); }
              }
            }
          }
        }
      });

      // Render Annual P/L Bar Chart
      if (_myReturnsChart) _myReturnsChart.destroy();
      _myReturnsChart = new Chart(canvasRet.getContext('2d'), {
        type: 'bar',
        data: {
          labels: retLabels,
          datasets: [{
            data: retData,
            backgroundColor: retBgColors,
            borderColor: retColors,
            borderWidth: 1.5,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1a212c' }, ticks: { color: '#5b6576' } },
            y: {
              grid: { color: '#1a212c' },
              ticks: {
                color: '#5b6576',
                callback: function (value) { return '₹' + Number(value).toLocaleString('en-IN'); }
              }
            }
          }
        }
      });
    }

    /* =========================================================================
       SETTINGS
       ========================================================================= */
    function renderSettings(host) {
      const s = STATE.settings;
      host.innerHTML = `
    <div class="page-head"><div><h1>Settings</h1><p>Risk parameters and connection details</p></div></div>
    
    <div class="settings-container">
      <!-- Left Column: Risk Rules, Dhan, Connection -->
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <!-- Card 1: Risk Rules -->
        <div class="panel" style="padding: 14px; margin-bottom: 0;">
          <div class="panel-head" style="margin-bottom: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <h3>Journal Risk Rules</h3>
            <button class="btn silver" id="saveSettingsBtn" style="padding: 4px 10px; font-size: 11px; margin: 0; line-height: 1.2; height: auto;">Save</button>
          </div>
          
          <div class="settings-rules-grid">
            <!-- Row 1 Left: Financial Year -->
            <div class="form-row">
              <span style="font-size: 12px; color: var(--dim); width: 110px; text-align: right;">Financial Year:</span>
              <input id="s_fy" value="${s.currentFY || ''}" style="flex: 1; height: 28px; padding: 4px 8px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
            </div>
            <!-- Row 1 Right: Opening Capital -->
            <div class="settings-rules-right">
              <span style="font-size: 12px; color: var(--dim); width: 110px; text-align: right;">Opening Capital:</span>
              <input type="number" id="s_open" value="${s.openingCapitalFY || ''}" style="flex: 1; height: 28px; padding: 4px 8px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
            </div>

            <!-- Row 2 Left: Risk% Per Trade -->
            <div class="form-row">
              <span style="font-size: 12px; color: var(--dim); width: 110px; text-align: right;">Risk% Per Trade:</span>
              <input type="number" step="0.1" id="s_riskpct" value="${(Number(s.riskPctPerTrade || 0) * 100)}" style="flex: 1; height: 28px; padding: 4px 8px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
            </div>
            <!-- Row 2 Right: Pyramid Counts -->
            <div class="settings-rules-right">
              <span style="font-size: 12px; color: var(--dim); width: 110px; text-align: right;">Pyramid Counts:</span>
              <input type="number" id="s_pyramid" value="${s.pyramidDays || ''}" style="flex: 1; height: 28px; padding: 4px 8px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
            </div>

            <!-- Row 3 Left: Positions -->
            <div class="form-row">
              <span style="font-size: 12px; color: var(--dim); width: 110px; text-align: right;">Positions:</span>
              <div style="display: flex; align-items: center; gap: 4px; flex: 1;">
                <input type="number" id="s_minpos" value="${s.maxStocksMin || ''}" style="width: 45%; height: 28px; padding: 4px 8px; font-size: 12px; text-align: center; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
                <span style="color: var(--dim); font-size: 12px;">-</span>
                <input type="number" id="s_maxpos" value="${s.maxStocksMax || ''}" style="width: 45%; height: 28px; padding: 4px 8px; font-size: 12px; text-align: center; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
              </div>
            </div>
            <!-- Row 3 Right: Default Brokerage -->
            <div class="settings-rules-right">
              <span style="font-size: 12px; color: var(--dim); width: 110px; text-align: right;">Default Brokerage:</span>
              <input type="number" id="s_brok" value="${s.brokeragePerTrade !== undefined && s.brokeragePerTrade !== '' ? s.brokeragePerTrade : 0}" placeholder="0 (Delivery) or 20 (Intraday)" style="flex: 1; height: 28px; padding: 4px 8px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
            </div>
            <div style="font-size: 11px; color: var(--sub); margin-top: 4px; grid-column: span 2; text-align: right;">Note: Delivery trades have ₹0 brokerage in India (Zerodha/Dhan). Intraday/F&O traders can set custom charges per order (e.g. ₹20). You can also edit charges per trade anytime.</div>
          </div>
        </div>

        <!-- Card 2: Broker Sync & Connection -->
        <div class="panel" style="padding: 14px; margin-bottom: 0;">
          <div class="panel-head" style="margin-bottom: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <h3>Broker Sync &amp; Connection</h3>
            <button class="btn silver" id="saveDhanBtn" style="padding: 4px 10px; font-size: 11px; margin: 0; line-height: 1.2; height: auto;">Save</button>
          </div>
          <div class="form-row" style="margin-bottom: 10px;">
            <span style="font-size: 12px; color: var(--dim); width: 110px; text-align: right;">Dhan Access Token:</span>
            <input type="password" id="s_dhan_token" value="${localStorage.getItem('tj_dhan_token') || ''}" placeholder="Paste Dhan Token" style="flex: 1; height: 28px; padding: 4px 8px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; outline: none;">
          </div>
          <div style="border-top: 1px solid var(--line-soft); margin: 12px 0; padding-top: 10px; display: flex; justify-content: flex-start;">
            <button class="btn ghost danger" id="disconnectBtn" style="padding: 6px 16px; font-size: 12px; height: 32px; width: auto;">Disconnect (Backend-GS)</button>
          </div>
        </div>
      </div>

      <div class="panel" style="padding: 14px; margin-bottom: 0; display: flex; flex-direction: column; overflow-x: auto;">
        <div class="panel-head" style="margin-bottom: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <h3>Capital Additions &amp; Withdrawals Log</h3>
          <button class="btn silver" id="addCapBtn" style="padding: 4px 10px; font-size: 11px; margin: 0; line-height: 1.2; height: auto;">Save</button>
          <button class="btn ghost" id="cancelCapEditBtn" style="display:none; padding: 4px 10px; font-size: 11px; margin: 0; line-height: 1.2; height: auto;">Cancel</button>
        </div>
        <div style="max-height: 180px; overflow: auto; width: 100%; max-width: 100%; -webkit-overflow-scrolling: touch; margin-bottom: 12px; border: 1px solid var(--line-soft); border-radius: 4px;">
          <table style="width: 75%; min-width: 480px; table-layout: fixed;">
            <thead>
              <tr>
                <th style="width: 90px;">Date</th>
                <th style="width: 110px;">Amount</th>
                <th>Note</th>
                <th style="width: 80px; text-align: right; padding-right: 4px;">Action</th>
              </tr>
            </thead>
            <tbody>${STATE.capitalLog.map((c, idx) => `<tr><td>${formatDateDMY(c.date)}</td><td style="color:${c.amount >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600;">${c.amount >= 0 ? '+' : ''}${fmtRs(c.amount)}</td><td style="font-family:var(--sans);">${c.note || ''}</td><td style="text-align:right; padding-right:2px;"><button class="btn ghost" style="padding: 2px 3px; font-size: 9.5px; margin-right: 1px;" onclick="editCapitalChange(${idx})">Edit</button><button class="btn danger ghost" style="padding: 2px 3px; font-size: 9.5px;" onclick="deleteCapitalChange(${idx})">✕</button></td></tr>`).join('')}</tbody>
          </table>
        </div>
        <div class="form-two-col" style="border-top: 1px solid var(--line-soft); padding-top: 12px;">
          <div class="field">
            <label>Type</label>
            <select id="c_type" style="background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px; outline:none; height:28px; font-size:12px; width: 100%;">
              <option value="add">Capital Addition (+)</option>
              <option value="withdraw">Capital Withdrawal (-)</option>
            </select>
          </div>
          <div class="field"><label>Date</label><input type="date" id="c_date" value="${todayISO()}" style="height:28px; padding:4px 8px; font-size:12px;"></div>
          <div class="field"><label>Amount (₹)</label><input type="number" id="c_amount" placeholder="e.g. 50000" style="height:28px; padding:4px 8px; font-size:12px;"></div>
          <div class="field"><label>Note</label><input type="text" id="c_note" placeholder="Optional notes..." style="height:28px; padding:4px 8px; font-size:12px;"></div>
        </div>
      </div>
    </div>
  `;

      $('#saveSettingsBtn').onclick = async () => {
        const settings = {
          currentFY: $('#s_fy').value, openingCapitalFY: parseFloat($('#s_open').value) || 0,
          riskPctPerTrade: (parseFloat($('#s_riskpct').value) || 0) / 100,
          maxStocksMin: parseFloat($('#s_minpos').value) || 0, maxStocksMax: parseFloat($('#s_maxpos').value) || 0,
          pyramidDays: parseFloat($('#s_pyramid').value) || 0, brokeragePerTrade: parseFloat($('#s_brok').value) >= 0 ? parseFloat($('#s_brok').value) : 0
        };
        STATE.settings = settings;
        saveLocalState();
        toast('Settings saved', 'ok');
        renderShell();
        apiPost({ action: 'updateSettings', settings }).catch(err => toast('Sync failed: ' + err.message, 'err'));
      };
      $('#addCapBtn').onclick = async () => {
        const type = $('#c_type').value;
        let amount = parseFloat($('#c_amount').value);
        if (isNaN(amount) || amount <= 0) { toast('Enter a valid positive amount', 'err'); return; }
        if (type === 'withdraw') {
          amount = -amount;
        }
        const note = $('#c_note').value.trim() || (type === 'withdraw' ? 'Capital withdrawal' : 'Capital addition');
        const isEdit = STATE.editingCapitalIndex != null;
        const capIdx = STATE.editingCapitalIndex;
        const entry = { date: $('#c_date').value, amount, note };

        if (isEdit) {
          STATE.capitalLog[capIdx] = entry;
          STATE.editingCapitalIndex = null;
          toast('Capital change updated', 'ok');
          apiPost({ action: 'updateCapital', index: capIdx, entry }).catch(err => toast('Sync failed: ' + err.message, 'err'));
        } else {
          STATE.capitalLog.push(entry);
          toast('Capital change logged', 'ok');
          apiPost({ action: 'addCapital', entry }).catch(err => toast('Sync failed: ' + err.message, 'err'));
        }
        saveLocalState();
        renderShell();
      };

      $('#cancelCapEditBtn').onclick = () => {
        STATE.editingCapitalIndex = null;
        $('#c_date').value = todayISO();
        $('#c_amount').value = '';
        $('#c_note').value = '';
        $('#c_type').value = 'add';
        $('#addCapBtn').textContent = 'Save';
        $('#cancelCapEditBtn').style.display = 'none';
      };

      window.editCapitalChange = (idx) => {
        const log = STATE.capitalLog[idx];
        if (!log) return;
        STATE.editingCapitalIndex = idx;
        $('#c_date').value = log.date;
        $('#c_amount').value = Math.abs(log.amount);
        $('#c_note').value = log.note || '';
        $('#c_type').value = log.amount >= 0 ? 'add' : 'withdraw';
        $('#addCapBtn').textContent = 'Save';
        $('#cancelCapEditBtn').style.display = 'inline-block';
      };

      window.deleteCapitalChange = async (index) => {
        if (!confirm('Delete this capital change entry?')) return;
        STATE.capitalLog.splice(index, 1);
        saveLocalState();
        toast('Logged capital change deleted', 'ok');
        renderShell();
        apiPost({ action: 'deleteCapital', index }).catch(err => toast('Sync failed: ' + err.message, 'err'));
      };
      $('#saveDhanBtn').onclick = () => {
        const t = $('#s_dhan_token').value.trim();
        localStorage.setItem('tj_dhan_token', t);
        toast('Dhan token saved locally', 'ok');
      };
      $('#disconnectBtn').onclick = () => {
        if (confirm('Disconnect? You will need the URL and token again to reconnect.')) {
          localStorage.removeItem(CFG_KEY); location.reload();
        }
      };
    }

    /* =========================================================================
       GLOBAL KEYBOARD SHORTCUTS (Ctrl+S / Cmd+S for Saving)
       ========================================================================= */
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();

        // 1. Check if a modal is open
        const modalBg = $('#modalBg');
        if (modalBg && modalBg.classList.contains('show')) {
          const mSaveBtn = $('#m_updateRemarks') || $('#sync_run') || $('#custom_win_save');
          if (mSaveBtn && typeof mSaveBtn.onclick === 'function') {
            mSaveBtn.click();
            return;
          }
        }

        // 2. View-specific save buttons
        if (STATE.view === 'add') {
          const btn = $('#saveTradeBtn');
          if (btn) btn.click();
        } else if (STATE.view === 'risk') {
          const btn = $('#addWlBtn');
          if (btn) btn.click();
        } else if (STATE.view === 'expenses') {
          const btn = $('#addExpenseBtn');
          if (btn) btn.click();
        } else if (STATE.view === 'multiyear') {
          const btn = $('#saveYearsBtn');
          if (btn) btn.click();
        } else if (STATE.view === 'settings') {
          const activeEl = document.activeElement;
          if (activeEl && (activeEl.id === 'c_amount' || activeEl.id === 'c_note' || activeEl.id === 'c_date' || activeEl.id === 'c_type')) {
            const btn = $('#addCapBtn');
            if (btn) btn.click();
          } else {
            const btn = $('#saveSettingsBtn');
            if (btn) btn.click();
          }
        } else {
          const btn = $('#saveTradeBtn') || $('#saveSettingsBtn') || $('#cfgSave');
          if (btn) btn.click();
        }
      }
    });

    /* =========================================================================
       BOOT
       ========================================================================= */
    (function init() {
      if (CONFIG && CONFIG.apiUrl && CONFIG.token) { boot(); }
      else { renderSetup(); }
    })();
  </script>
</body>
