<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0e14;
      --bg2: #0d1219;
      --panel: #121822;
      --panel2: #161e2b;
      --line: #212a38;
      --line-soft: #1a212c;
      --text: #e7ebf1;
      --sub: #8b96a8;
      --dim: #5b6576;
      --gold: #d4a24e;
      --gold-soft: #3a2f1c;
      --green: #33d17a;
      --green-soft: #0f2a1c;
      --red: #ff5c5c;
      --red-soft: #2f1414;
      --blue: #5aa9ff;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --sans: 'Inter', system-ui, sans-serif;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow-x: hidden;
      max-width: 100vw;
    }

    body {
      background: radial-gradient(1200px 600px at 15% -10%, #131a26 0%, var(--bg) 55%);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--gold-soft);
      color: var(--gold);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    a {
      color: inherit;
    }

    button {
      font-family: var(--sans);
      cursor: pointer;
    }

    input,
    select {
      font-family: var(--mono);
    }

    /* ---------- Ticker strip ---------- */
    .ticker {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      background: linear-gradient(180deg, #0d1219, #0a0e14);
      border-bottom: 1px solid var(--line);
      padding: 0 20px;
      height: 46px;
      white-space: nowrap;
    }

    .sidebar::-webkit-scrollbar {
      display: none;
    }

    .ticker::-webkit-scrollbar {
      display: none;
    }

    .tick {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 0 18px;
      border-right: 1px solid var(--line-soft);
      height: 100%;
      align-items: center;
    }

    .tick:last-child {
      border-right: none;
    }

    .tick .lbl {
      font-size: 10px;
      letter-spacing: .08em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .tick .val {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 13px;
    }

    .up {
      color: var(--green);
    }

    .down {
      color: var(--red);
    }

    .flat {
      color: var(--sub);
    }

    /* ---------- Shell ---------- */
    .shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 46px);
    }

    .sidebar {
      border-right: 1px solid var(--line);
      padding: 22px 14px;
      background: var(--bg2);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 22px;
    }

    .brand .mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--gold), #8a6420);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      color: #0a0e14;
      font-size: 13px;
    }

    .brand .name {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -.01em;
    }

    .brand .sub {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: .06em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--sub);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: .85;
    }

    .nav-item:hover {
      background: var(--panel2);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--gold-soft);
      color: var(--gold);
      border-color: #4a3a20;
    }

    .side-foot {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
    }

    .side-foot button {
      width: 100%;
      background: none;
      border: 1px solid var(--line);
      color: var(--dim);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
    }

    .side-foot button:hover {
      color: var(--sub);
      border-color: var(--sub);
    }

    .main {
      padding: 26px 30px 60px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      box-sizing: border-box;
      min-width: 0;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: fade .25s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-head h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .page-head p {
      color: var(--sub);
      font-size: 12.5px;
      margin-top: 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: .15s;
    }

    .btn:hover {
      border-color: var(--sub);
    }

    .btn.primary {
      background: linear-gradient(180deg, #e6b563, var(--gold));
      color: #231a08;
      border: none;
    }

    .btn.primary:hover {
      filter: brightness(1.06);
    }

    .btn.danger {
      color: var(--red);
    }

    .btn.ghost {
      background: none;
      border: 1px solid var(--line);
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* ---------- Cards / grid ---------- */
    .grid-cards {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      width: 100%;
    }

    .grid-cards .card-cap {
      flex: 1.3 1 0;
    }

    .grid-cards .card-pnl {
      flex: 1.3 1 0;
    }

    .grid-cards .card-avg {
      flex: 1.25 1 0;
    }

    .grid-cards .card-exp {
      flex: 1.1 1 0;
    }

    .grid-cards .card-win1 {
      flex: 1.25 1 0;
    }

    .grid-cards .card-win2 {
      flex: 1.25 1 0;
    }

    .grid-cards .card-open {
      flex: 0.8 1 0;
    }

    @media(max-width: 980px) {
      .grid-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .grid-cards .card-cap,
      .grid-cards .card-pnl,
      .grid-cards .card-avg,
      .grid-cards .card-exp,
      .grid-cards .card-win1,
      .grid-cards .card-win2,
      .grid-cards .card-open {
        flex: none;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      min-height: 96px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .card[onclick]:hover {
      border-color: var(--gold);
      background: var(--panel2);
    }

    .card .lbl {
      font-size: 10.5px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 600;
    }

    .card .num {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
    }

    .card .sub {
      font-size: 11px;
      color: var(--sub);
      margin-top: auto;
      padding-top: 4px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .panel-head h3 {
      font-size: 13.5px;
      font-weight: 700;
    }

    .panel-head .hint {
      font-size: 11.5px;
      color: var(--dim);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    /* Prevent grid items containing canvas/tables from overflowing */
    .two-col>div,
    .expenses-grid>div,
    .multiyear-container>div {
      min-width: 0;
    }


    /* Mobile header bar */
    .mobile-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      padding: 0 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      z-index: 90;
    }

    .hamburger-btn,
    .mobile-refresh-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 4px;
    }

    .hamburger-btn:hover,
    .mobile-refresh-btn:hover {
      background: var(--panel2);
    }

    .brand-mobile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mobile .mark {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--gold), #8a6420);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      color: #0a0e14;
      font-size: 11px;
    }

    .brand-mobile .name {
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: -.01em;
    }

    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 10, 0.6);
      z-index: 99;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sidebar-backdrop.show {
      display: block;
      opacity: 1;
    }

    /* Grid layout overrides */
    .overview-grid-top {
      display: grid;
      grid-template-columns: 2.2fr 1.8fr 2fr 2.2fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .overview-grid-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .add-trade-container,
    .calc-container {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .form-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row-span-2 {
      grid-column: span 2;
    }

    .metrics-grid {
      border-left: 1px solid var(--line-soft);
      padding-left: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
    }

    .expenses-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 14px;
    }

    .multiyear-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .settings-container {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 14px;
      align-items: start;
    }

    .settings-rules-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
    }

    .settings-rules-right {
      border-left: 1px solid var(--line-soft);
      padding-left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 14px;
      gap: 14px;
    }

    .active-exposure-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
      text-align: center;
    }

    /* Responsiveness Breakpoints */
    @media(max-width:980px) {
      .mobile-bar {
        display: flex;
      }

      .two-col {
        grid-template-columns: 1fr;
      }

      .shell {
        grid-template-columns: 1fr;
        min-height: calc(100vh - 96px);
        /* ticker + mobile-bar height */
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: -260px;
        width: 250px;
        height: 100vh;
        z-index: 100;
        transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
      }

      .sidebar.open {
        left: 0;
      }

      .main {
        padding: 16px 16px 40px;
        width: 100%;
      }

      .add-trade-container,
      .calc-container,
      .expenses-grid,
      .multiyear-container,
      .settings-container {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .metrics-grid {
        border-left: none;
        padding-left: 0;
        border-top: 1px solid var(--line-soft);
        padding-top: 20px;
      }
    }

    @media(max-width:800px) {
      .overview-grid-top {
        grid-template-columns: 1fr 1fr;
      }

      .settings-rules-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .settings-rules-right {
        border-left: none;
        padding-left: 0;
        border-top: 1px solid var(--line-soft);
        padding-top: 16px;
      }
    }

    @media(max-width:760px) {
      .modal-two-col {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    @media(max-width:600px) {

      .overview-grid-top,
      .overview-grid-bottom {
        grid-template-columns: 1fr;
      }

      .form-two-col {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .form-row,
      .settings-rules-right {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .form-row span:first-child,
      .form-row label,
      .settings-rules-right span:first-child,
      .settings-rules-right label {
        text-align: left !important;
        width: auto !important;
      }

      .form-row>input,
      .form-row>select,
      .form-row>div,
      .settings-rules-right>input,
      .settings-rules-right>select,
      .settings-rules-right>div {
        width: 100% !important;
      }

      .form-row-span-2 {
        grid-column: span 1;
      }

      .active-exposure-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .modal {
        padding: 16px;
      }

      .my-fixed-h {
        height: 240px !important;
      }
    }

    @media(max-width:480px) {
      .active-exposure-grid {
        grid-template-columns: 1fr;
      }

      .form-grid,
      .form-grid.c3 {
        grid-template-columns: 1fr;
      }

      .toolbar input {
        min-width: 0;
        flex: 1 1 140px;
      }

      .page-head h1 {
        font-size: 17px;
      }

      .card .num {
        font-size: 19px;
      }

      .card {
        padding: 12px 14px;
        min-height: 84px;
      }

      .modal {
        padding: 14px;
        border-radius: 10px;
      }

      .modal-bg {
        padding: 20px 8px;
      }

      .btn {
        padding: 8px 11px;
        font-size: 12.5px;
      }
    }

    @media(max-height:480px) and (max-width:900px) {
      .modal-bg {
        align-items: flex-start;
        padding: 12px 16px;
      }
    }

    /* Settings Sub-Navigation */
    .settings-nav-btn {
      background: none;
      border: none;
      text-align: left;
      padding: 10px 14px;
      color: var(--sub);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .settings-nav-btn:hover {
      color: var(--text);
      background: var(--bg2);
    }

    .settings-nav-btn.active {
      color: var(--text) !important;
      background: var(--line-soft) !important;
      font-weight: 600 !important;
    }

    /* ---------- Tables ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    /* Compact trade list (used on Overview) */
    .compact-trade-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .compact-trade-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel2);
      cursor: pointer;
      transition: .15s;
    }

    .compact-trade-row:hover {
      border-color: var(--line);
    }

    .ctr-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ctr-stock {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
    }

    .ctr-mid {
      display: flex;
      justify-content: space-between;
      color: var(--sub);
      font-family: var(--mono);
      font-size: 11.5px;
      flex-wrap: wrap;
      gap: 4px 10px;
    }

    .ctr-bottom {
      font-family: var(--mono);
      font-size: 12.5px;
    }

    thead th {
      text-align: left;
      color: var(--dim);
      font-weight: 600;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    tbody td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line-soft);
      white-space: nowrap;
      font-family: var(--mono);
    }

    tbody tr {
      transition: .1s;
    }

    tbody tr:hover {
      background: var(--panel2);
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      font-family: var(--sans);
    }

    .badge.open {
      background: #1b2a3d;
      color: var(--blue);
    }

    .badge.closed-win {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge.closed-loss {
      background: var(--red-soft);
      color: var(--red);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar input,
    .toolbar select {
      background: var(--bg2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12.5px;
    }

    .toolbar input {
      min-width: 180px;
    }

    .seg {
      display: flex;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .seg button {
      background: none;
      border: none;
      color: var(--sub);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .seg button.on {
      background: var(--gold-soft);
      color: var(--gold);
    }

    /* ---------- Forms ---------- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .form-grid.c3 {
      grid-template-columns: repeat(3, 1fr);
    }

    @media(max-width:760px) {

      .form-grid,
      .form-grid.c3 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 11px;
      color: var(--sub);
      font-weight: 600;
      letter-spacing: .02em;
    }

    .field input,
    .field select,
    .field textarea {
      background: var(--bg2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 7px;
      font-size: 13px;
      width: 100%;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .field.readonly input {
      color: var(--sub);
      background: #0d1119;
    }

    .field .derived {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      padding: 9px 0;
    }

    fieldset {
      border: 1px solid var(--line-soft);

    /* Footer styles */

<body>

  <div id="app"></div>
  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modalBody"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================================
       CONFIG + STATE
       ========================================================================= */
    const CFG_KEY = 'tj_config_v1';
    let CONFIG = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); // {apiUrl, token}

    let STATE = {
      trades: [], settings: {}, capitalLog: [], multiYear: [], expenses: [],
      view: 'overview', tradeFilter: 'open', search: '', editingCapitalIndex: null,
      editingWlIdx: null, editingExpenseIndex: null, livePrices: {},
      monthlySort: { col: 'key', dir: 'desc' },
      expenseSort: { col: 'date', dir: 'desc' },
      tradeSort: { col: 'openDate', dir: 'desc' },
      multiYearSort: { col: 'year', dir: 'asc' },
      customWinRateStart: localStorage.getItem('tj_custom_win_rate_start') || '',
      customWinRateEnd: localStorage.getItem('tj_custom_win_rate_end') || '2026-03-31'
    };

    const $ = sel => document.querySelector(sel);
    const fmt = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtPct = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '—' : (Number(n) * 100).toFixed(2) + '%';
    const fmtRs = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '—' : '₹' + fmt(n);
    const todayISO = () => new Date().toISOString().slice(0, 10);

    function handleQtyPercentageInput(qtyInput, getFullQtyFn) {
      qtyInput.onchange = () => {
        let val = qtyInput.value.trim();
        if (val.endsWith('%')) {
          const pct = parseFloat(val) / 100;
          const fullQty = getFullQtyFn();
          if (pct > 0 && fullQty > 0) {
            qtyInput.value = Math.floor(fullQty * pct);
            qtyInput.dispatchEvent(new Event('input'));
          }
        }
      };
    }

    function toast(msg, kind) {
      const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (kind || '');
      setTimeout(() => t.classList.remove('show'), 3200);
    }

    /* Helper to convert YYYY-MM-DD to DD-MM-YY */
    function formatDateDMY(dateStr) {
      if (!dateStr || dateStr === '—') return '—';
      // Standardize potential DateTime inputs (slice to Date only)
      const cleanStr = (typeof dateStr === 'string') ? dateStr.split(' ')[0] : '';
      const parts = cleanStr.split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        const y = parts[0].slice(-2); // last 2 digits of year
        const m = parts[1];
        const d = parts[2];
        return `${d}-${m}-${y}`;
      }
      return dateStr;
    }

    function getPyramidFillsBadges(t) {
      const tranches = [];

      // Tranche 1
      if (t.entry1Qty && t.entry1Price) {
        tranches.push({ label: 'E1', qty: t.entry1Qty, price: t.entry1Price });
      }
      // Tranche 2
      if (t.entry2Qty && t.entry2Price) {
        tranches.push({ label: 'E2', qty: t.entry2Qty, price: t.entry2Price });
      }
      // Tranche 3
      if (t.entry3Qty && t.entry3Price) {
        tranches.push({ label: 'E3', qty: t.entry3Qty, price: t.entry3Price });
      }
      // Tranche 4
      if (t.entry4Qty && t.entry4Price) {
        tranches.push({ label: 'E4', qty: t.entry4Qty, price: t.entry4Price });
      }
      // Tranche 5
      if (t.entry5Qty && t.entry5Price) {
        tranches.push({ label: 'E5', qty: t.entry5Qty, price: t.entry5Price });
      }
      // Tranche 6
      if (t.entry6Qty && t.entry6Price) {
        tranches.push({ label: 'E6', qty: t.entry6Qty, price: t.entry6Price });
      }

      // Parse extra tranches from remarks (for backward compatibility or 7+)
      const extraTranches = {};
      const remarks = t.remarks || '';
      const regex = /\[Tranche (\d+): ₹([\d\.,]+) × (\d+)(?:\s+on\s+([^\]]+))?\]/g;
      let match;
      while ((match = regex.exec(remarks)) !== null) {
        const num = parseInt(match[1]);
        const price = parseFloat(match[2].replace(/,/g, ''));
        const qty = parseInt(match[3]);
        const date = match[4] || '';
        extraTranches[num] = { price, qty, date };
      }

      // Tranches 7+
      Object.keys(extraTranches)
        .map(Number)
        .filter(num => num > 6)
        .sort((a, b) => a - b)
        .forEach(num => {
          const et = extraTranches[num];
          tranches.push({ label: `E${num}`, qty: et.qty, price: et.price });
        });

      return tranches.map(tr => `
        <span style="font-size: 9px; font-family: var(--mono); background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; color: var(--sub); display: inline-flex; align-items: center; gap: 3px; margin-right: 4px; margin-top: 3px;">
          <strong style="color: var(--gold); font-size: 8.5px;">${tr.label}</strong>
          <span>${tr.qty}@₹${fmt(tr.price)}</span>
        </span>
      `).join('');
    }

    /* =========================================================================
       API
       ========================================================================= */
    async function apiGet() {
      const url = CONFIG.apiUrl + '?action=all&token=' + encodeURIComponent(CONFIG.token);
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error ' + res.status);
      return res.json();
    }
    async function apiPost(body) {
      const res = await fetch(CONFIG.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
        body: JSON.stringify({ ...body, token: CONFIG.token })
      });
      if (!res.ok) throw new Error('API error ' + res.status);
      const j = await res.json();
      if (j.error) throw new Error(j.error);
      return j;
    }

    async function loadAll() {
      const data = await apiGet();
      STATE.trades = (data.trades || []).map(normalizeTrade);
      STATE.settings = data.settings || {};
      STATE.capitalLog = data.capitalLog || [];
      STATE.multiYear = data.multiYear || [];
      STATE.expenses = data.expenses || [];
      STATE.watchlist = (data.watchlist || []).map(normalizeWatchlist);
      if (typeof cleanAndDeduplicateAugustTrades === 'function') {
        cleanAndDeduplicateAugustTrades();
      }
      saveLocalState();
    }

    function saveLocalState() {
      const data = {
        trades: STATE.trades,
        settings: STATE.settings,
        capitalLog: STATE.capitalLog,
        multiYear: STATE.multiYear,
        expenses: STATE.expenses,
        watchlist: STATE.watchlist
      };
      localStorage.setItem('tj_cached_state', JSON.stringify(data));
    }

    function normalizeTrade(t) {
      const num = k => t[k] === '' || t[k] === undefined || t[k] === null ? null : Number(t[k]);
      const norm = {
        ...t,
        breadth: num('breadth'), entryPct: num('entryPct'), riskPerShare: num('riskPerShare'),
        entry1Price: num('entry1Price'), entry1Qty: num('entry1Qty'), entry1Amt: num('entry1Amt'),
        entry2Price: num('entry2Price'), entry2Qty: num('entry2Qty'), entry2Amt: num('entry2Amt'),
        entry3Price: num('entry3Price'), entry3Qty: num('entry3Qty'), entry3Amt: num('entry3Amt'),
        entry4Price: num('entry4Price'), entry4Qty: num('entry4Qty'), entry4Amt: num('entry4Amt'),
        entry5Price: num('entry5Price'), entry5Qty: num('entry5Qty'), entry5Amt: num('entry5Amt'),
        entry6Price: num('entry6Price'), entry6Qty: num('entry6Qty'), entry6Amt: num('entry6Amt'),
        avgBuyPrice: num('avgBuyPrice'), totBuyQty: num('totBuyQty'), totBuyAmt: num('totBuyAmt'),
        slPrice: num('slPrice'), slPerShare: num('slPerShare'), slPct: num('slPct'),
        fullQty: num('fullQty'), totLossAtSL: num('totLossAtSL'), brokerage: num('brokerage'),
        exit1Price: num('exit1Price'), exit1Qty: num('exit1Qty'), exit2Price: num('exit2Price'), exit2Qty: num('exit2Qty'),
        exit3Price: num('exit3Price'), exit3Qty: num('exit3Qty'),
        totExitAmt: num('totExitAmt'), pnl: num('pnl'), pnlPct: num('pnlPct'), days: num('days'), rr: num('rr'), tslPrice: num('tslPrice')
      };

      const buy = aggregateBuy(norm);
      const ex = aggregateExit(norm);
      const totBuyAmt = buy.totBuyAmt || norm.totBuyAmt;
      const totBuyQty = buy.totBuyQty || norm.totBuyQty;
      const avgBuyPrice = buy.avgBuyPrice || norm.avgBuyPrice;
      const totExitAmt = ex.totExitAmt != null ? ex.totExitAmt : norm.totExitAmt;
      const totExitQty = ex.totExitQty;
      const avgSellPrice = ex.avgSellPrice != null ? ex.avgSellPrice : norm.avgSellPrice;

      let pnl = norm.pnl;
      let pnlPct = norm.pnlPct;

      if (norm.status === 'closed' || (totExitQty > 0 && totExitQty >= totBuyQty)) {
        if (totExitAmt != null && totBuyAmt > 0) {
          const grossPnl = totExitAmt - totBuyAmt;
          pnl = Math.round(grossPnl);
          pnlPct = totBuyAmt ? +(grossPnl / totBuyAmt).toFixed(4) : 0;
        }
      }

      return {
        ...norm,
        totBuyAmt,
        totBuyQty,
        avgBuyPrice,
        totExitAmt,
        avgSellPrice,
        pnl,
        pnlPct
      };
    }

    function normalizeWatchlist(w) {
      const num = k => w[k] === '' || w[k] === undefined || w[k] === null ? null : Number(w[k]);
      return {
        ...w,
        entryPrice: num('entryPrice'),
        slPrice: num('slPrice'),
        slPct: num('slPct'),
        qty: num('qty'),
        posSize: num('posSize'),
        risk: num('risk'),
        entryPct: num('entryPct'),
        breadth: num('breadth')
      };
    }

    function getTradeTrancheCounts(t) {
      const extraTranches = {};
      const extraExits = {};
      const remarks = t.remarks || '';

      const regexBuy = /\[Tranche (\d+): ₹([\d\.,]+) × (\d+)(?:\s+on\s+([^\]]+))?\]/g;
      let match;
      while ((match = regexBuy.exec(remarks)) !== null) {
        extraTranches[parseInt(match[1])] = true;
      }

      const regexExit = /\[Exit (\d+): ₹([\d\.,]+) × (\d+)\]/g;
      let matchExit;
      while ((matchExit = regexExit.exec(remarks)) !== null) {
        extraExits[parseInt(matchExit[1])] = true;
      }

      let buyCount = 0;
      if (t.entry1Price && t.entry1Qty) buyCount++;
      if (t.entry2Price && t.entry2Qty) buyCount++;
      if (t.entry3Price && t.entry3Qty) buyCount++;
      if (t.entry4Price && t.entry4Qty) buyCount++;
      if (t.entry5Price && t.entry5Qty) buyCount++;
      if (t.entry6Price && t.entry6Qty) buyCount++;
      Object.keys(extraTranches).forEach(n => { if (Number(n) >= 7) buyCount++; });
      if (buyCount === 0) buyCount = 1;

      let exitCount = 0;
      const ex1P = extraExits[1] ? true : (t.exit1Price && t.exit1Qty);
      const ex2P = extraExits[2] ? true : (t.exit2Price && t.exit2Qty);
      const ex3P = extraExits[3] ? true : (t.exit3Price && t.exit3Qty);
      if (ex1P) exitCount++;
      if (ex2P) exitCount++;
      if (ex3P) exitCount++;
      Object.keys(extraExits).forEach(n => { if (Number(n) >= 4) exitCount++; });

      const totalCount = buyCount + exitCount;
      return { buyCount, exitCount, totalCount };
    }

    function getSettingBrokerage() {
      if (STATE.settings && STATE.settings.brokeragePerTrade !== undefined && STATE.settings.brokeragePerTrade !== '' && !isNaN(Number(STATE.settings.brokeragePerTrade))) {
        return Number(STATE.settings.brokeragePerTrade);
      }
      return 0;
    }

    function getDefaultTradeBrokerage(t) {
      const defaultPerOrder = getSettingBrokerage();
      const counts = getTradeTrancheCounts(t);
      const defaultTotal = defaultPerOrder * counts.totalCount;
      if (t.brokerage != null && t.brokerage !== '' && (Number(t.brokerage) !== defaultPerOrder || counts.totalCount === 1)) {
        return Number(t.brokerage);
      }
      return defaultTotal;
    }

    function computeOpenTradePnL(t) {
      if (t.status !== 'open') return { pnl: t.pnl, pnlPct: t.pnlPct };
      const defaultPerOrder = getSettingBrokerage();
      const counts = getTradeTrancheCounts(t);
      const totalBrok = getDefaultTradeBrokerage(t);
      const perLegBrok = counts.totalCount ? (totalBrok / counts.totalCount) : totalBrok;

      const extraExits = {};
      const remarks = t.remarks || '';
      const regexExit = /\[Exit (\d+): ₹([\d\.,]+) × (\d+)\]/g;
      let matchExit;
      while ((matchExit = regexExit.exec(remarks)) !== null) {
        const num = parseInt(matchExit[1]);
        const price = parseFloat(matchExit[2].replace(/,/g, ''));
        const qty = parseInt(matchExit[3]);
        const amt = Math.round(price * qty);
        extraExits[num] = { price, qty, amt };
      }

      const ex1Price = extraExits[1] ? extraExits[1].price : t.exit1Price;
      const ex1Qty = extraExits[1] ? extraExits[1].qty : t.exit1Qty;
      const ex2Price = extraExits[2] ? extraExits[2].price : t.exit2Price;
      const ex2Qty = extraExits[2] ? extraExits[2].qty : t.exit2Qty;
      const ex3Price = extraExits[3] ? extraExits[3].price : t.exit3Price;
      const ex3Qty = extraExits[3] ? extraExits[3].qty : t.exit3Qty;

      const totExitQty = [ex1Qty, ex2Qty, ex3Qty].reduce((s, q) => s + (Number(q) || 0), 0) + Object.values(extraExits).filter((e, idx) => idx >= 3).reduce((s, e) => s + e.qty, 0);
      const remainingQty = Number(t.totBuyQty || 0) - totExitQty;

      const totExitAmt = [
        ex1Price && ex1Qty ? Math.round(ex1Price * ex1Qty) : 0,
        ex2Price && ex2Qty ? Math.round(ex2Price * ex2Qty) : 0,
        ex3Price && ex3Qty ? Math.round(ex3Price * ex3Qty) : 0
      ].reduce((s, a) => s + a, 0) + Object.values(extraExits).filter((e, idx) => idx >= 3).reduce((s, e) => s + Math.round(e.price * e.qty), 0);

      const totBuyAmt = Number(t.totBuyAmt || 0);
      const totBuyQty = Number(t.totBuyQty || 1);
      const realizedCost = totBuyQty ? (totExitQty * (totBuyAmt / totBuyQty)) : 0;
      const realizedPnL = totExitQty > 0 ? Math.round(totExitAmt - realizedCost) : 0;

      const activeSL = (t.tslPrice != null && t.tslPrice !== '') ? Number(t.tslPrice) : Number(t.slPrice || 0);
      const expectedExitAmtOnRemaining = Math.max(0, Math.round(activeSL * remainingQty - (remainingQty > 0 ? defaultPerOrder : 0)));
      const remainingCost = totBuyAmt - realizedCost;
      const expectedPnLOnRemaining = remainingQty > 0 ? (expectedExitAmtOnRemaining - remainingCost) : 0;
      const expectedPnL = Math.round(expectedPnLOnRemaining + realizedPnL);
      const expectedPnLPct = totBuyAmt ? expectedPnL / totBuyAmt : 0;

      return { pnl: expectedPnL, pnlPct: expectedPnLPct };
    }

    /* =========================================================================
       DERIVED PORTFOLIO METRICS  (mirrors the Excel PF sheet)
       ========================================================================= */
    function currentCapital() {
      const opening = Number(STATE.settings.openingCapitalFY || 0);
      const closedRealizedPnl = STATE.trades.filter(t => t.status === 'closed').reduce((s, t) => s + (t.pnl || 0), 0);

      const openPartialRealizedPnl = STATE.trades.filter(t => t.status === 'open').reduce((s, t) => {
        const normT = normalizeTrade(t);
        const buy = aggregateBuy(normT);
        const ex = aggregateExit(normT);
        if (ex.totExitQty > 0 && ex.totExitAmt) {
          const totBuyAmt = buy.totBuyAmt || 0;
          const totBuyQty = buy.totBuyQty || 1;
          const realizedCost = totBuyQty ? (ex.totExitQty * (totBuyAmt / totBuyQty)) : 0;
          return s + Math.round(ex.totExitAmt - realizedCost);
        }
        return s;
      }, 0);

      const totalExpenses = STATE.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      return opening + capitalAdditionsExcludingOpening() + closedRealizedPnl + openPartialRealizedPnl - totalExpenses;
    }
    function added0() { return 0; }
    function capitalAdditionsExcludingOpening() {
      return STATE.capitalLog.filter(c => !/opening/i.test(c.note || '')).reduce((s, c) => s + Number(c.amount || 0), 0);
    }
    function monthKey(dateStr) { if (!dateStr) return null; const d = new Date(dateStr); return isNaN(d) ? null : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
    function monthLabel(key) { const [y, m] = key.split('-'); return new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'short', year: '2-digit' }); }

    function getFYOfDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('-');
      if (parts.length < 2) return null;
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);
      if (isNaN(year) || isNaN(month)) return null;
      if (month >= 4) {
        return `${year}-${year + 1}`;
      } else {
        return `${year - 1}-${year}`;
      }
    }

    function getAvailableFYs() {
      const fys = new Set();
      if (STATE.settings.currentFY) {
        const f = formatFY(STATE.settings.currentFY);
        if (f) fys.add(f);
      }
      (STATE.trades || []).forEach(t => {
        if (t.status === 'closed' && t.closedDate) {
          const fy = getFYOfDate(t.closedDate);
          if (fy) fys.add(fy);
        }
      });
      (STATE.expenses || []).forEach(e => {
        if (e.date) {
          const fy = getFYOfDate(e.date);
          if (fy) fys.add(fy);
        }
      });
      return Array.from(fys).sort().reverse();
    }

    function monthlyPnL(filterFY) {
      const map = {};
      STATE.trades.filter(t => t.status === 'closed' && t.closedDate).forEach(t => {
        if (filterFY && filterFY !== 'All') {
          const fy = getFYOfDate(t.closedDate);
          if (fy !== filterFY) return;
        }
        const k = monthKey(t.closedDate); if (!k) return;
        map[k] = map[k] || { won: 0, lost: 0, winAmt: 0, lossAmt: 0, pnl: 0, charges: 0 };
        if (t.pnl >= 0) { map[k].won++; map[k].winAmt += t.pnl; } else { map[k].lost++; map[k].lossAmt += t.pnl; }
        map[k].pnl += t.pnl;
        map[k].charges += Number(t.brokerage || 0);
      });
      (STATE.expenses || []).forEach(e => {
        if (filterFY && filterFY !== 'All') {
          const fy = getFYOfDate(e.date);
          if (fy !== filterFY) return;
        }
        const k = monthKey(e.date); if (!k) return;
        map[k] = map[k] || { won: 0, lost: 0, winAmt: 0, lossAmt: 0, pnl: 0, charges: 0 };
        map[k].pnl -= Number(e.amount || 0);
      });
      Object.keys(map).forEach(k => {
        map[k].pnl -= map[k].charges;
      });
      return Object.keys(map).sort().map(k => ({ key: k, label: monthLabel(k), ...map[k] }));
    }

    function navigateToMonthTrades(monthKey) {
      if (!monthKey) return;
      STATE.view = 'trades';
      STATE.tradeFilter = 'pnl';
      STATE.selectedTradeMonth = monthKey;

    }

    function overviewStats() {
      const activeFYLabel = formatFY(STATE.settings.currentFY);
      const closed = STATE.trades.filter(t => t.status === 'closed');
      const open = STATE.trades.filter(t => t.status === 'open');

      const invested = open.reduce((sum, t) => {
        const normT = normalizeTrade(t);
        const buy = aggregateBuy(normT);
        const ex = aggregateExit(normT);
        const totBuyAmt = buy.totBuyAmt || 0;
        const totBuyQty = buy.totBuyQty || 1;
        const totExitQty = ex.totExitQty || 0;
        const realizedCost = totBuyQty ? (totExitQty * (totBuyAmt / totBuyQty)) : 0;
        const remainingCost = Math.max(0, Math.round(totBuyAmt - realizedCost));
        return sum + remainingCost;
      }, 0);

      const closedFY = activeFYLabel
        ? closed.filter(t => t.closedDate && formatFY(getFYOfDate(t.closedDate)) === activeFYLabel)
        : closed;
      const wonFY = closedFY.filter(t => t.pnl >= 0);
      const lostFY = closedFY.filter(t => t.pnl < 0);
      const realizedPnlFY = closedFY.reduce((s, t) => s + (t.pnl || 0), 0);
      const totalChargesFY = closedFY.reduce((s, t) => s + Number(t.brokerage || 0), 0);

      const expensesFY = (STATE.expenses || []).filter(e => {
        if (!activeFYLabel) return true;
        return e.date && formatFY(getFYOfDate(e.date)) === activeFYLabel;
      }).reduce((sum, e) => sum + Number(e.amount || 0), 0);

      const netPnlFY = realizedPnlFY - totalChargesFY - expensesFY;

      const openRisk = open.reduce((s, t) => {
        const extraExits = {};
        const remarks = t.remarks || '';
        const regexExit = /\[Exit (\d+): ₹([\d\.,]+) × (\d+)\]/g;
        let matchExit;
        while ((matchExit = regexExit.exec(remarks)) !== null) {
          const num = parseInt(matchExit[1]);
          const qty = parseInt(matchExit[3]);
          extraExits[num] = { qty };
        }
        const ex1Qty = extraExits[1] ? extraExits[1].qty : t.exit1Qty;
        const ex2Qty = extraExits[2] ? extraExits[2].qty : t.exit2Qty;
        const ex3Qty = extraExits[3] ? extraExits[3].qty : t.exit3Qty;
        const totExitQty = [ex1Qty, ex2Qty, ex3Qty].reduce((sum, q) => sum + (Number(q) || 0), 0) + Object.values(extraExits).filter((e, idx) => idx >= 3).reduce((sum, e) => sum + e.qty, 0);
        const remainingQty = Number(t.totBuyQty || 0) - totExitQty;

        const activeSL = (t.tslPrice != null && t.tslPrice !== '') ? Number(t.tslPrice) : Number(t.slPrice || 0);
        const riskPerShare = Number(t.avgBuyPrice || 0) - activeSL;
        const tradeRisk = riskPerShare > 0 ? Math.round(riskPerShare * remainingQty) : 0;
        return s + tradeRisk;
      }, 0);

      const openPLAtTSL = open.reduce((s, t) => {
        const normT = normalizeTrade(t);
        const openPnL = computeOpenTradePnL(normT);
        return s + (openPnL ? (openPnL.pnl || 0) : 0);
      }, 0);

      const opening = Number(STATE.settings.openingCapitalFY || 0);
      const cap = currentCapital();
      const cash = cap - invested;

      const customStart = STATE.customWinRateStart || getFirstTradeDate();
      const customEnd = STATE.customWinRateEnd || '2026-03-31';
      const closedPre = closed.filter(t => t.closedDate && t.closedDate >= customStart && t.closedDate <= customEnd);
      const wonPre = closedPre.filter(t => t.pnl >= 0);
      const lostPre = closedPre.filter(t => t.pnl < 0);

      const closedPost = closed.filter(t => t.closedDate && t.closedDate >= '2026-04-01');
      const wonPost = closedPost.filter(t => t.pnl >= 0);
      const lostPost = closedPost.filter(t => t.pnl < 0);

      const totalWinAmt = wonFY.reduce((sum, t) => sum + (t.pnl || 0), 0);
      const totalLossAmt = lostFY.reduce((sum, t) => sum + Math.abs(t.pnl || 0), 0);
      const avgWin = wonFY.length ? Math.round(totalWinAmt / wonFY.length) : 0;
      const avgLoss = lostFY.length ? Math.round(totalLossAmt / lostFY.length) : 0;
      const winLossRatio = avgLoss ? +(avgWin / avgLoss).toFixed(2) : 0;
      const expectancy = closedFY.length ? Math.round(netPnlFY / closedFY.length) : 0;
      const expectancyR = closedFY.length ? +(closedFY.reduce((sum, t) => sum + (t.rr || 0), 0) / closedFY.length).toFixed(2) : 0;

      const allTimeRealizedPnl = closed.reduce((s, t) => s + (t.pnl || 0), 0);
      const allTimeExpenses = (STATE.expenses || []).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const cumPnl = allTimeRealizedPnl - allTimeExpenses;

      const avgCapital = calculateActiveYearAverageCapital();
      const returnPctFY = avgCapital ? (netPnlFY / avgCapital) : (opening ? netPnlFY / opening : 0);

      // Compute Compounded Cumulative Return %
      const multiRows = (STATE.multiYear || []).map(r => ({ ...r, returnPct: Number(r.returnPct || 0) }));
      const activeIdx = multiRows.findIndex(r => formatFY(r.year) === activeFYLabel);
      if (activeIdx !== -1) {
        multiRows[activeIdx].returnPct = returnPctFY * 100;
      } else if (activeFYLabel) {
        multiRows.push({ year: activeFYLabel, returnPct: returnPctFY * 100 });
      }
      multiRows.sort((a, b) => (parseInt((a.year || '').split('-')[0]) || 0) - (parseInt((b.year || '').split('-')[0]) || 0));
      let compoundFactor = 1.0;
      multiRows.forEach(r => {
        compoundFactor *= (1 + Number(r.returnPct || 0) / 100);
      });
      const cumReturnPct = compoundFactor - 1;

      return {
        capital: cap,
        invested,
        cash,
        opening,
        avgCapital,
        realizedPnl: realizedPnlFY,
        totalChargesFY,
        expensesFY,
        netPnlFY,
        cumPnl,
        cumReturnPct,
        returnPct: returnPctFY,
        winPct: closedFY.length ? wonFY.length / closedFY.length : (closed.length ? won.length / closed.length : 0),
        wonCount: wonFY.length, lostCount: lostFY.length, openCount: open.length,
        openRisk,
        openPLAtTSL,
        riskBudget: cap * Number(STATE.settings.riskPctPerTrade || 0.01),
        winPctPre: closedPre.length ? wonPre.length / closedPre.length : 0,
        wonCountPre: wonPre.length,
        lostCountPre: lostPre.length,
        winPctPost: closedPost.length ? wonPost.length / closedPost.length : 0,
        wonCountPost: wonPost.length,
        lostCountPost: lostPost.length,
        avgWin,
        avgLoss,
        winLossRatio,
        expectancy,
        expectancyR
      };
    }

    function renderTicker(s) {
      const ret = s.returnPct;
      const cumRet = s.cumReturnPct;
      const winCls = s.winPct >= 0.5 ? 'up' : 'down';

    /* =========================================================================
       TRADE MATH  (mirrors JL-N calc sheet logic)
       ========================================================================= */
    function computeEntryCalc({ capital, riskPct, entryPct, entryPrice, slPrice, brokerage }) {
      const slPerShare = (entryPrice != null && slPrice != null) ? +(entryPrice - slPrice).toFixed(4) : null;
      const slPctVal = (slPerShare != null && entryPrice) ? slPerShare / entryPrice : null;
      const riskAt1 = capital * riskPct;
      const fullQty = (slPerShare && slPerShare > 0) ? Math.floor(riskAt1 / slPerShare) : null;
      const entry1Qty = (fullQty != null) ? Math.floor(fullQty * entryPct) : null;
      const totLossAtSL = (entry1Qty != null && slPerShare != null) ? Math.round(entry1Qty * slPerShare) : null;
      const entry1Amt = (entryPrice != null && entry1Qty != null) ? Math.round(entryPrice * entry1Qty + Number(brokerage || 0)) : null;
      return { slPerShare, slPct: slPctVal, fullQty, entry1Qty, totLossAtSL, entry1Amt };
    }

    function calcDeliveryCharges(buyTurnover = 0, sellTurnover = 0) {
      if (!buyTurnover && !sellTurnover) return getSettingBrokerage();
      const bSTT = buyTurnover * 0.001;
      const bStamp = buyTurnover * 0.00015;
      const bExch = buyTurnover * 0.0000345;
      const bSebi = buyTurnover * 0.000001;
      const bGst = (bExch + bSebi) * 0.18;
      const buyCharges = bSTT + bStamp + bExch + bSebi + bGst;

      const sSTT = sellTurnover * 0.001;
      const sDp = sellTurnover > 0 ? 14.75 : 0;
      const sExch = sellTurnover * 0.0000345;
      const sSebi = sellTurnover * 0.000001;
      const sGst = (sExch + sSebi) * 0.18;
      const sellCharges = sSTT + sDp + sExch + sSebi + sGst;

      return Math.max(1, Math.round(buyCharges + sellCharges));
    }

    function calcIntradayCharges(buyTurnover = 0, sellTurnover = 0) {
      if (!buyTurnover && !sellTurnover) return 40;
      const bBrok = buyTurnover > 0 ? Math.min(20, buyTurnover * 0.0003) : 0;
      const sBrok = sellTurnover > 0 ? Math.min(20, sellTurnover * 0.0003) : 0;
      const totBrok = bBrok + sBrok;

      const sSTT = sellTurnover * 0.00025;
      const bStamp = buyTurnover * 0.00003;
      const bExch = buyTurnover * 0.0000345;
      const sExch = sellTurnover * 0.0000345;
      const bSebi = buyTurnover * 0.000001;
      const sSebi = sellTurnover * 0.000001;
      const gst = (totBrok + bExch + sExch + bSebi + sSebi) * 0.18;

      const totalCharges = totBrok + sSTT + bStamp + bExch + sExch + bSebi + sSebi + gst;
      return Math.max(1, Math.round(totalCharges));
    }

    function calcTradeCharges(buyTurnover = 0, sellTurnover = 0, isIntraday = false) {
      if (isIntraday) {
        return calcIntradayCharges(buyTurnover, sellTurnover);
      }
      return calcDeliveryCharges(buyTurnover, sellTurnover);
    }

    function aggregateBuy(t) {
      const legs = [
        [t.entry1Price, t.entry1Qty, t.entry1Amt], [t.entry2Price, t.entry2Qty, t.entry2Amt], [t.entry3Price, t.entry3Qty, t.entry3Amt],
        [t.entry4Price, t.entry4Qty, t.entry4Amt], [t.entry5Price, t.entry5Qty, t.entry5Amt], [t.entry6Price, t.entry6Qty, t.entry6Amt]
      ].filter(([p, q]) => p != null && q);
      const totBuyQty = legs.reduce((s, [, q]) => s + Number(q), 0);
      const totBuyAmt = legs.reduce((s, [p, q, a]) => {
        const legAmt = (a != null && a !== '') ? Number(a) : Math.round(Number(p) * Number(q));
        return s + legAmt;
      }, 0);
      const avgBuyPrice = totBuyQty ? +(totBuyAmt / totBuyQty).toFixed(2) : null;
      return { totBuyAmt: legs.length ? Math.round(totBuyAmt) : null, totBuyQty, avgBuyPrice };
    }
    function aggregateExit(t) {
      const remarks = t.remarks || '';
      const extraExits = {};
      const regexExit = /Exit\s*#?(\d+)[:\s]+(\d+(?:\.\d+)?)\s*x\s*(\d+)/gi;
      let matchExit;
      while ((matchExit = regexExit.exec(remarks)) !== null) {
        const num = parseInt(matchExit[1]);
        const price = parseFloat(matchExit[2].replace(/,/g, ''));
        const qty = parseInt(matchExit[3]);
        extraExits[num] = { price, qty };
      }

      const ex1Price = extraExits[1] ? extraExits[1].price : t.exit1Price;
      const ex1Qty = extraExits[1] ? extraExits[1].qty : t.exit1Qty;
      const ex2Price = extraExits[2] ? extraExits[2].price : t.exit2Price;
      const ex2Qty = extraExits[2] ? extraExits[2].qty : t.exit2Qty;
      const ex3Price = extraExits[3] ? extraExits[3].price : t.exit3Price;
      const ex3Qty = extraExits[3] ? extraExits[3].qty : t.exit3Qty;

      const legs = [
        [ex1Price, ex1Qty],
        [ex2Price, ex2Qty],
        [ex3Price, ex3Qty]
      ].filter(([p, q]) => p != null && q);

      Object.keys(extraExits)
        .map(Number)
        .filter(num => num > 3)
        .sort((a, b) => a - b)
        .forEach(num => {
          const ee = extraExits[num];
          legs.push([ee.price, ee.qty]);
        });

      const totExitQty = legs.reduce((s, [, q]) => s + Number(q), 0);
      const grossExitAmt = legs.reduce((s, [p, q]) => s + (Number(p) * Number(q)), 0);
      const totExitAmt = Math.round(grossExitAmt);
      const avgSellPrice = totExitQty ? +(grossExitAmt / totExitQty).toFixed(2) : null;
      return { totExitAmt: legs.length ? totExitAmt : null, totExitQty, avgSellPrice, grossExitAmt };
    }

    async function boot() {
      const cached = localStorage.getItem('tj_cached_state');
      let loadedCached = false;
      if (cached) {
        try {
          const data = JSON.parse(cached);
          STATE.trades = (data.trades || []).map(normalizeTrade);
          STATE.settings = data.settings || {};
          STATE.capitalLog = data.capitalLog || [];
          STATE.multiYear = data.multiYear || [];
          STATE.expenses = data.expenses || [];
          STATE.watchlist = (data.watchlist || []).map(normalizeWatchlist);

          if (typeof cleanAndDeduplicateAugustTrades === 'function') {
            cleanAndDeduplicateAugustTrades();
          }

          renderShell();
          loadedCached = true;
        } catch (e) {
          // Ignore parse errors and fall back to loading screen
        }
      }

      if (!loadedCached) {
        $('#app').innerHTML = `<div class="loading-screen"><span class="spinner"></span> Loading your journal…</div>`;
      }

      try {
        await loadAll();
        renderShell();

        if (!loadedCached) {
          $('#app').innerHTML = `<div class="loading-screen">Could not load data: ${err.message}<br><br>

        }
      }
    }

    function tradeTableHTML(list, opts) {
      opts = opts || {};
      const compact = !!opts.compact;
      if (!list.length) return `<div class="empty"><h4>${opts.emptyText || 'No trades to show'}</h4><p>${opts.emptySubtext || 'Add your first trade to get started.'}</p></div>`;

            (t.pnl >= 0 ? '<span class="badge closed-win">WIN</span>' : '<span class="badge closed-loss">LOSS</span>');
          const amount = Number(t.totBuyQty || 0) * Number(t.avgBuyPrice || 0);
          let ctrBottomContent = '';
          if (isOpen) {
            const normT = normalizeTrade(t);
            const openPnL = computeOpenTradePnL(normT);
            const pnlTSL = openPnL ? openPnL.pnl : null;
            const pnlTSLPct = openPnL ? openPnL.pnlPct : null;
            const activeSL = (t.tslPrice != null && t.tslPrice !== '') ? Number(t.tslPrice) : Number(t.slPrice || 0);
            const slLabel = (t.tslPrice != null && t.tslPrice !== '') ? 'TSL' : 'SL';

            const tslPnlHtml = (pnlTSL != null && activeSL > 0) ?
              `<span>P/L at ${slLabel}: <span style="color:${pnlTSL >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600;">${pnlTSL >= 0 ? '+' : ''}${fmtRs(pnlTSL)}${pnlTSLPct != null ? ` (${fmtPct(pnlTSLPct)})` : ''}</span></span>` : '';

            let livePnlVal = null, livePnlPctVal = null;
            const livePrice = STATE.livePrices[t.stock];
            if (livePrice != null) {
              const remainingQty = Number(t.totBuyQty || 0);
              livePnlVal = Math.round((livePrice - Number(t.avgBuyPrice || 0)) * remainingQty);
              livePnlPctVal = t.totBuyAmt ? livePnlVal / Number(t.totBuyAmt) : null;
            }
            const livePnlHtml = livePnlVal != null ?
              `<span>Live: <span style="color:${livePnlVal >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600;">${livePnlVal >= 0 ? '+' : ''}${fmtRs(livePnlVal)}${livePnlPctVal != null ? ` (${fmtPct(livePnlPctVal)})` : ''}</span></span>` : '';

            if (tslPnlHtml || livePnlHtml) {
              ctrBottomContent = `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px 10px; font-size:11.5px;">${tslPnlHtml}${livePnlHtml}</div>`;
            } else {
              ctrBottomContent = `<span style="color:var(--dim); font-size:11.5px;">—</span>`;
            }
          } else {
            const pnlVal = t.pnl, pnlPctVal = t.pnlPct;
            ctrBottomContent = pnlVal == null ? '<span style="color:var(--dim); font-size:11.5px;">—</span>' :
              `<span style="color:${pnlVal >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600; font-size:11.5px;">P/L: ${pnlVal >= 0 ? '+' : ''}${fmtRs(pnlVal)}${pnlPctVal != null ? ` (${fmtPct(pnlPctVal)})` : ''}</span>`;
          }

          return `
            <div class="compact-trade-row" data-id="${t.id}" onclick="STATE.view='trades';renderShell();">
              <div class="ctr-top">
                <span class="ctr-stock">${t.stock || '—'}</span>
                ${badge}
              </div>
              <div class="ctr-mid">
                <span>${formatDateDMY(t.openDate)}</span>
                <span>${fmt(t.totBuyQty)} @ ${fmt(t.avgBuyPrice)} · ${fmtRs(amount)}</span>
              </div>
              <div class="ctr-bottom">${ctrBottomContent}</div>
            </div>
          `;
        }).join('');
        return `<div class="compact-trade-list">${rows}</div>`;
      }

      const isOpenTab = STATE.tradeFilter === 'open';
      let sumAmount = 0;
      let sumBrokerage = 0;
      let sumPLAtTSL = 0;
      let sumLivePL = 0;
      let livePricesCount = 0;

      const rowsHtml = list.map(t => {
        const badge = t.status === 'open' ? '<span class="badge open">OPEN</span>' :
          (t.pnl >= 0 ? '<span class="badge closed-win">WIN</span>' : '<span class="badge closed-loss">LOSS</span>');

        const amount = Number(t.totBuyQty || 0) * Number(t.avgBuyPrice || 0);
        const normT = normalizeTrade(t);
        const ex = aggregateExit(normT);
        const brok = getDefaultTradeBrokerage(t);
        sumBrokerage += brok;
        const avgSellStr = ex.avgSellPrice != null ? fmt(ex.avgSellPrice) : '—';

        let customColsHtml = '';
        if (isOpenTab) {
          const extraExits = {};
          const remarks = t.remarks || '';
          const regexExit = /\[Exit (\d+): ₹([\d\.,]+) × (\d+)\]/g;
          let matchExit;
          while ((matchExit = regexExit.exec(remarks)) !== null) {
            const num = parseInt(matchExit[1]);
            const price = parseFloat(matchExit[2].replace(/,/g, ''));
            const qty = parseInt(matchExit[3]);
            const amt = Math.round(price * qty);
            extraExits[num] = { price, qty, amt };
          }

          const ex1Price = extraExits[1] ? extraExits[1].price : t.exit1Price;
          const ex1Qty = extraExits[1] ? extraExits[1].qty : t.exit1Qty;
          const ex2Price = extraExits[2] ? extraExits[2].price : t.exit2Price;
          const ex2Qty = extraExits[2] ? extraExits[2].qty : t.exit2Qty;
          const ex3Price = extraExits[3] ? extraExits[3].price : t.exit3Price;
          const ex3Qty = extraExits[3] ? extraExits[3].qty : t.exit3Qty;

          const totExitQty = [ex1Qty, ex2Qty, ex3Qty].reduce((s, q) => s + (Number(q) || 0), 0) + Object.values(extraExits).filter((e, idx) => idx >= 3).reduce((s, e) => s + e.qty, 0);
          const remainingQty = Number(t.totBuyQty || 0) - totExitQty;

          const totExitAmt = [
            ex1Price && ex1Qty ? Math.round(ex1Price * ex1Qty) : 0,
            ex2Price && ex2Qty ? Math.round(ex2Price * ex2Qty) : 0,
            ex3Price && ex3Qty ? Math.round(ex3Price * ex3Qty) : 0
          ].reduce((s, a) => s + a, 0) + Object.values(extraExits).filter((e, idx) => idx >= 3).reduce((s, e) => s + e.amt, 0);

          const realizedCost = totExitQty * Number(t.avgBuyPrice || 0);
          const realizedPnL = totExitQty > 0 ? Math.round(totExitAmt - realizedCost) : 0;

          const pnlAtTS = t.pnl == null ? 0 : t.pnl;
          const livePrice = STATE.livePrices[t.stock];
          let livePnLHtml = '<td>—</td><td>—</td>';
          let livePnL = 0;
          let hasLivePrice = false;
          if (livePrice != null) {

    function pnlTableHTML(list) {
      // Filter strictly to closed trades with valid exit dates
      const closedTrades = list.filter(t => t.status === 'closed' && t.closedDate);
      if (!closedTrades.length) return `<div class="empty"><h4>No realized trades found</h4><p>Closed trades will appear here grouped by close date.</p></div>`;

      // Group trades by month of closedDate
      const groups = {};
      closedTrades.forEach(t => {
        const key = monthKey(t.closedDate) || 'unknown';
        if (!groups[key]) groups[key] = [];
        groups[key].push(t);
      });

      // Sort month keys descending (most recent months first)
      const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

      return sortedKeys.map(key => {
        const monthTrades = groups[key];
        const label = key === 'unknown' ? 'Unknown Month' : monthLabel(key);
        const grossPnl = monthTrades.reduce((sum, t) => sum + (Number(t.pnl) || 0), 0);
        const monthCharges = monthTrades.reduce((sum, t) => sum + Number(t.brokerage || 0), 0);

        // Match expenses logged in this specific month
        const monthManualExp = (STATE.expenses || [])
          .filter(e => monthKey(e.date) === key)
          .reduce((sum, e) => sum + Number(e.amount || 0), 0);

        const totalMonthExpenses = monthCharges + monthManualExp;
        const netPnl = grossPnl - totalMonthExpenses;

        // Sort trades in this month by closedDate descending
        monthTrades.sort((a, b) => (b.closedDate || '').localeCompare(a.closedDate || ''));

        return `
      <div class="month-group" id="month-group-${key}" style="margin-bottom: 24px; transition: all 0.3s ease;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:rgba(255,255,255,.02); border:1px solid var(--line); border-radius:6px; margin-bottom:8px; flex-wrap: wrap; gap: 8px;">

        <div style="overflow-x:auto;">

              <tr>

            </thead>
            <tbody>
              ${monthTrades.map(t => {
          const badge = '<span class="badge closed-win">WIN</span>';

    function parseDhanCsvDate(dateStr) {
      if (!dateStr) return todayISO();
      const clean = dateStr.replace(/"/g, '').trim();
      const parts = clean.split(/\s+/);
      if (parts.length < 3) return todayISO();
      const day = parts[0].padStart(2, '0');
      const monthMap = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
      const month = monthMap[parts[1].substring(0, 3).toLowerCase()] || '01';
      const year = parts[2];
      return `${year}-${month}-${day}`;
    }

    function normalizeStockSymbol(sym) {
      if (!sym) return '';
      const s = String(sym).trim().toUpperCase();
      if (/^BHEL$|^BHARAT HEAVY/i.test(s)) return 'BHARAT HEAVY ELECTRICALS';
      if (/^SYRMA/i.test(s)) return 'SYRMA SGS';
      if (/^AVL$|^ADITYA VISION/i.test(s)) return 'ADITYA VISION';
      if (/^SANSERA/i.test(s)) return 'SANSERA ENGINEERING';
      if (/^SONA/i.test(s)) return 'SONA BLW PRECISION FORGINGS';
      if (/^KALYAN/i.test(s)) return 'KALYAN JEWELLERS';
      if (/^OFSS$|^ORACLE/i.test(s)) return 'ORACLE FINANCIAL SERVICES SOFTWARE';
      if (/^GOLDBEES$|^NIPPON GOLD/i.test(s)) return 'NIPPON GOLD ETF (GOLDBEES)';
      if (/^BLS/i.test(s)) return 'BLS E-SERVICES';
      if (/^RRKABEL$|^RR KABEL/i.test(s)) return 'RR KABEL';
      if (/^CRAFTSMAN/i.test(s)) return 'CRAFTSMAN AUTOMATION';
      if (/^POWERINDIA$|^HITACHI/i.test(s)) return 'HITACHI ENERGY';
      if (/^SOLARINDUSTRIES$|^SOLAR/i.test(s)) return 'SOLAR INDUSTRIES';
      if (/^HAPPYFORGE$|^HAPPY FORGINGS/i.test(s)) return 'HAPPY FORGINGS';
      if (/^ACUTAAS/i.test(s)) return 'ACUTAAS CHEMICALS';
      if (/^ANANDRATHI$|^ANAND RATHI/i.test(s)) return 'ANAND RATHI WEALTH';
      if (/^JSWSTEEL$|^JSW STEEL/i.test(s)) return 'JSW STEEL';
      return s;
    }

    async function processDhanCsvContent(csvText) {
      const lines = csvText.split(/\r?\n/);
      const rows = [];

      let headerFound = false;
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        if (trimmed.startsWith('Date,Scrip Name')) {
          headerFound = true;
          return;
        }
        if (trimmed.startsWith('Net P&L') || trimmed.startsWith('NOTE')) {
          headerFound = false;
          return;
        }
        if (headerFound) {
          const matches = trimmed.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || trimmed.split(',');
          const cols = matches.map(m => m.replace(/^"|"$/g, '').trim());
          if (cols.length >= 15) {
            rows.push({
              date: parseDhanCsvDate(cols[0]),
              stock: normalizeStockSymbol(cols[1]),
              exchange: cols[2],
              billNo: cols[3],
              buyQty: parseFloat(cols[4]) || 0,
              buyVal: parseFloat(cols[5]) || 0,
              sellQty: parseFloat(cols[6]) || 0,
              sellVal: parseFloat(cols[7]) || 0,
              brokerage: parseFloat(cols[8]) || 0,
              gst: parseFloat(cols[9]) || 0,
              stt: parseFloat(cols[10]) || 0,
              sebi: parseFloat(cols[11]) || 0,
              stamp: parseFloat(cols[12]) || 0,
              txn: parseFloat(cols[13]) || 0,
              oth: parseFloat(cols[14]) || 0
            });
          }
        }
      });

      if (!rows.length) {
        toast('No valid transaction rows found in Dhan CSV', 'err');
        return;
      }

      const grouped = {};
      rows.forEach(r => {
        const stock = r.stock;
        if (!grouped[stock]) grouped[stock] = [];
        grouped[stock].push(r);
      });

      let updatedCount = 0;
      let newCount = 0;

      Object.keys(grouped).forEach(stock => {
        const stockRows = grouped[stock];
        let buyQty = 0, buyVal = 0, sellQty = 0, sellVal = 0;
        let totalCharges = 0;
        let openDate = stockRows[0].date;
        let closedDate = '';
        const buyLegs = [];
        const exitLegs = [];

        stockRows.forEach(r => {
          const rowCharges = r.brokerage + r.gst + r.stt + r.sebi + r.stamp + r.txn + r.oth;
          totalCharges += rowCharges;

          if (r.buyQty > 0) {
            buyQty += r.buyQty;
            buyVal += r.buyVal;
            buyLegs.push({ price: r.buyVal / r.buyQty, qty: r.buyQty, amt: r.buyVal, date: r.date });
          }
          if (r.sellQty > 0) {
            sellQty += r.sellQty;
            sellVal += r.sellVal;
            exitLegs.push({ price: r.sellVal / r.sellQty, qty: r.sellQty, amt: r.sellVal, date: r.date });
            closedDate = r.date;
          }
        });

        const normStock = normalizeStockSymbol(stock);
        let existing = STATE.trades.find(t => normalizeStockSymbol(t.stock) === normStock && t.status === 'open');
        if (!existing) {
          existing = STATE.trades.find(t => normalizeStockSymbol(t.stock) === normStock);
        }

        const isClosed = sellQty > 0 && sellQty >= buyQty;
        const grossPnl = isClosed ? (sellVal - buyVal) : (sellQty > 0 ? (sellVal - (sellQty * (buyVal / (buyQty || 1)))) : 0);
        const avgBuy = buyQty ? +(buyVal / buyQty).toFixed(2) : 0;
        const avgSell = sellQty ? +(sellVal / sellQty).toFixed(2) : null;
        const roundedCharges = +totalCharges.toFixed(2);

        const tradeObj = {
          id: existing ? existing.id : ('T' + String(Date.now()).slice(-4) + String(Math.floor(Math.random() * 100))),
          status: isClosed ? 'closed' : 'open',
          openDate: buyLegs.length ? buyLegs[0].date : openDate,

          entry1Qty: buyLegs[0] ? buyLegs[0].qty : '',

          exit3Qty: exitLegs[2] ? exitLegs[2].qty : '',
          totBuyQty: buyQty,
          totBuyAmt: Math.round(buyVal),
          avgBuyPrice: avgBuy,
          totExitAmt: sellQty ? Math.round(sellVal) : '',
          avgSellPrice: avgSell,
          brokerage: roundedCharges,

          pnlPct: buyVal ? +(grossPnl / buyVal).toFixed(4) : 0,

        if (existing) {

            updatedCount++;
          }

          STATE.trades.push(tradeObj);
          newCount++;
        }
      });

      renderShell();
      toast(`Imported Dhan CSV: ${newCount} new, ${updatedCount} updated trades`, 'ok');

      });

    function getAvailablePeriods() {
      const months = new Set();
      const years = new Set();

      STATE.trades.forEach(t => {

        if (isNaN(d)) return;

        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        months.add(y + '-' + m);

        const fyStart = (d.getMonth() < 3) ? y - 1 : y;
        years.add(fyStart + '-' + (fyStart + 1));
      });

      const sortedMonths = Array.from(months).sort((a, b) => b.localeCompare(a));
      const sortedFYs = Array.from(years).sort((a, b) => b.localeCompare(a));

      return { months: sortedMonths, fys: sortedFYs };
    }

    function formatDateDMY_MMM(dateStr) {
      if (!dateStr || dateStr === '—') return '—';
      const cleanStr = (typeof dateStr === 'string') ? dateStr.split(' ')[0] : '';
      const parts = cleanStr.split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        const y = parts[0].slice(-2);
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const mIdx = parseInt(parts[1], 10) - 1;
        const m = months[mIdx] || parts[1];
        const d = parseInt(parts[2], 10);
        return `${d}-${m}-${y}`;
      }
      return dateStr;
    }

    function base64ToBlob(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        byteArrays.push(byteArray);
      }
      return new Blob(byteArrays, { type: mimeType });
    }

    function sortTradesList(list, sortState) {
      const col = (sortState && sortState.col) || 'openDate';
      const dir = (sortState && sortState.dir) || 'desc';
      list.sort((a, b) => {
        let vA, vB;
        if (col === 'openDate') { vA = a.openDate || ''; vB = b.openDate || ''; }
        else if (col === 'stock') { vA = (a.stock || '').toLowerCase(); vB = (b.stock || '').toLowerCase(); }
        else if (col === 'avgBuyPrice') { vA = Number(a.avgBuyPrice || 0); vB = Number(b.avgBuyPrice || 0); }
        else if (col === 'totBuyQty') { vA = Number(a.totBuyQty || 0); vB = Number(b.totBuyQty || 0); }
        else if (col === 'amount') { vA = Number(a.totBuyQty || 0) * Number(a.avgBuyPrice || 0); vB = Number(b.totBuyQty || 0) * Number(b.avgBuyPrice || 0); }
        else if (col === 'brokerage') { vA = getDefaultTradeBrokerage(a); vB = getDefaultTradeBrokerage(b); }
        else if (col === 'avgSellPrice') {
          const exA = aggregateExit(normalizeTrade(a)), exB = aggregateExit(normalizeTrade(b));
          vA = exA.avgSellPrice == null ? -Infinity : exA.avgSellPrice;
          vB = exB.avgSellPrice == null ? -Infinity : exB.avgSellPrice;
        }
        else if (col === 'slPrice') { vA = Number(a.slPrice || 0); vB = Number(b.slPrice || 0); }
        else if (col === 'status') { vA = a.status || ''; vB = b.status || ''; }
        else if (col === 'closedDate') { vA = a.closedDate || ''; vB = b.closedDate || ''; }
        else if (col === 'pnl' || col === 'pnlAtTSL') { vA = Number(a.pnl || 0); vB = Number(b.pnl || 0); }
        else if (col === 'pnlPct' || col === 'pnlAtTSLPct') { vA = Number(a.pnlPct || 0); vB = Number(b.pnlPct || 0); }
        else if (col === 'rr') { vA = a.rr == null ? -Infinity : Number(a.rr); vB = b.rr == null ? -Infinity : Number(b.rr); }
        else if (col === 'days') {
          vA = a.status === 'closed' ? (a.days == null ? -Infinity : Number(a.days)) : (isNaN(new Date(a.openDate)) ? -Infinity : Math.round((new Date() - new Date(a.openDate)) / 86400000));
          vB = b.status === 'closed' ? (b.days == null ? -Infinity : Number(b.days)) : (isNaN(new Date(b.openDate)) ? -Infinity : Math.round((new Date() - new Date(b.openDate)) / 86400000));
        }
        else if (col === 'livePnl' || col === 'livePnlPct') {
          const lA = STATE.livePrices[a.stock], lB = STATE.livePrices[b.stock];
          vA = lA != null ? Math.round((lA - Number(a.avgBuyPrice || 0)) * Number(a.totBuyQty || 0)) : -Infinity;
          vB = lB != null ? Math.round((lB - Number(b.avgBuyPrice || 0)) * Number(b.totBuyQty || 0)) : -Infinity;
          if (col === 'livePnlPct') {
            vA = (lA != null && a.totBuyAmt) ? vA / Number(a.totBuyAmt) : -Infinity;
            vB = (lB != null && b.totBuyAmt) ? vB / Number(b.totBuyAmt) : -Infinity;
          }
        } else {
          vA = a.openDate || ''; vB = b.openDate || '';
        }
        let res = typeof vA === 'number' ? vA - vB : String(vA).localeCompare(String(vB));
        return dir === 'asc' ? res : -res;
      });
      return list;
    }

    function renderTradeTable() {
      let list = STATE.trades.slice();
      if (STATE.search) list = list.filter(t => (t.stock || '').toLowerCase().includes(STATE.search.toLowerCase()));

      } else {
        if (STATE.tradeFilter !== 'all') list = list.filter(t => t.status === STATE.tradeFilter);
        sortTradesList(list, STATE.tradeSort);
        $('#tradeTableWrap').innerHTML = tradeTableHTML(list);
      }

      $('#tradeTableWrap').querySelectorAll('th[data-sort-col]').forEach(th => {
        th.onclick = (e) => {
          e.stopPropagation();
          const col = th.dataset.sortCol;
